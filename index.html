규칙 p.53","exp":"태극 8장: 앞굽이는 일직선상에서 발끝이 측면 쪽으로 약간 틀어진 상태. (모앞굽이 자세)","ans":"태극 8장의 외산틀막기는 앞굽이 자세에서 몸을 옆선으로 전환하며 두 팔로 산 모양의 틀을 만드는 동작입니다. 앞굽이 자세를 취할 때 발끝은 측면 쪽으로 약간 틀어진 모앞굽이 형태를 유지해야 합니다. 한 팔은 위쪽을 막고 다른 팔은 아래쪽이나 몸통 쪽을 막으며 허리 회전을 이용해 힘을 전달합니다. 바깥 막는 주먹의 높이가 머리 위로 올라가면 감점될 수 있으니 주의해야 합니다. 외산틀막기를 할 때는 동작을 천천히 하지 말고 정확하고 빠르게 수행하는 것이 중요합니다.","pre":[null,null,null],"memo":"","en":{"q":"태극 8장 외산틀막기 어떻게 해?","src":"Rules p.53","exp":"Rules p.53, Taegeuk 8: 앞굽이 in a straight line, with the toes turned slightly to the side (모앞굽이).","memo":""}},{"id":130,"sec":"특수 서기","q":"학다리서기는 어떻게 해?","src":"경기규칙 p.40","exp":"중심 발은 주춤서기 높이로 한다. 붙이는 발은 발날등을 중심 발 무릎 안쪽에 자연스럽게 힘을 빼고 붙인다. 든 발의 무릎이 앞을 향하도록 조여야 한다.","ans":"학다리서기는 모아서기에서 두 무릎을 구부려 자세를 낮춘 뒤 한쪽 발을 들어 올리는 동작입니다. 중심이 되는 발은 주춤서기 높이만큼 낮게 유지하고, 들어 올린 발의 발날등을 지지하는 발의 무릎 안쪽에 자연스럽게 붙여야 합니다. 이때 든 발의 무릎이 앞을 향하도록 안으로 조여주어야 하며, 무릎이 벌어지거나 지지하는 무릎 위에 발을 걸치지 않도록 주의해야 합니다. 지도할 때는 모아서기에서 시작하여 두 무릎을 구부리며 학다리라고 외치고, 발을 올리며 서기라고 복창하며 동작을 익히는 것이 좋습니다. 모든 서기 동작과 마찬가지로 시선은 정면을 향하고 턱을 가볍게 당겨 몸의 안정성을 유지해야 합니다.","pre":[null,null,null],"memo":"","en":{"q":"학다리서기는 어떻게 해?","src":"Rules p.40","exp":"Rules p.40: The supporting foot is at 주춤서기 height. The other foot's inner edge (발날등) rests, relaxed, against the inside of the supporting knee. The raised knee is drawn in so it faces forward.","memo":""}},{"id":131,"sec":"특수 서기","q":"오른서기가 뭐야?","src":"경기규칙 p.39","exp":"나란히서기와 모두 같으나 다만 한발은 제자리, 반대 발은 틀어 앞축을 90°로 돌려 딛는다.","ans":"오른서기는 나란히서기에서 한 발은 제자리에 두고 반대 발의 앞축을 90도 돌려 딛는 서기 동작입니다. 두 발의 각이 90도가 되지 않거나 두 발의 간격이 한 발 정도 벌어지지 않으면 감점될 수 있습니다.","pre":[null,null,null],"memo":"","en":{"q":"오른서기가 뭐야?","src":"Rules p.39","exp":"Rules p.39: the same as 나란히서기, except that one foot stays and the other turns so the ball of the foot is rotated 90°.","memo":""}},{"id":132,"sec":"특수 서기","q":"나란히서기 발 간격은?","src":"KTA 9급 서기 1단계","exp":"모아선 상태에서 왼발을 옆으로 90° 열어 '한발' 옮기고, 그 간격을 유지하며 나란하게 선다.","ans":"나란히서기는 모아서기에서 왼발을 한 발 길이만큼 옆으로 넓혀서 섭니다. 발 간격이 한 발 길이보다 좁거나 넓으면 감점될 수 있으니 주의하세요.","pre":[null,null,null],"memo":"","en":{"q":"나란히서기 발 간격은?","src":"KTA grade 9 stances step 1","exp":"KTA grade 9, stances step 1: from standing feet together, open the left foot 90° to the side, move it one foot's length, and keep that gap with the feet parallel.","memo":""}},{"id":133,"sec":"특수 서기","q":"범서기 체중은 어디에 실어?","src":"경기규칙 p.39","exp":"체중을 뒷발에 90~100% 싣는다.","ans":"범서기는 체중을 뒷발에 90에서 100퍼센트 실어야 합니다. 아랫배에 힘을 주어 중심을 뒷발에 정확히 유지해 보세요.","pre":[null,null,null],"memo":"","en":{"q":"범서기 체중은 어디에 실어?","src":"Rules p.39","exp":"Rules p.39: 90~100% on the back foot.","memo":""}},{"id":134,"sec":"특수 서기","q":"태극 7장 보주먹은 어떤 서기로 해?","src":"경기규칙 p.51","exp":"모아서기. 규칙 51쪽: 왼발 끌어 모둠발로 선다.","ans":"태극 7장의 보주먹 동작은 모아서기로 수행합니다. 중앙선에서 두 발을 모아 서서 동작을 완성하시면 됩니다.","pre":[null,null,null],"memo":"","en":{"q":"태극 7장 보주먹은 어떤 서기로 해?","src":"Rules p.51","exp":"모아서기. Rules p.51: draw the left foot in to stand with the feet together.","memo":""}},{"id":135,"sec":"오타 질문","q":"모서기 어떻게 해?","src":"경기규칙 p.40","exp":"모아서기로 알아들음(모서기가 모아서기인지 검토자 확인 필요). 규칙 40쪽: 두 발날등을 모아 맞대고 두 무릎을 곧게 편 서기 동작.","ans":"모아서기는 두 발날등을 서로 모아 맞대고 두 무릎을 곧게 펴서 서는 동작입니다. 두 발이 벌어지지 않도록 주의해야 하며 발날등을 붙인 상태를 유지하는 것이 중요합니다. 태극 7장의 14번째 동작인 모아서기 보주먹에서는 이 서기를 바탕으로 한 손으로 다른 주먹을 감싸 인중 높이까지 천천히 올리며 호흡을 정리합니다. 초보자는 보주먹을 할 때 팔을 너무 높이 들지 말고 인중 높이를 기준으로 맞추어 연습하시기 바랍니다.","pre":[null,null,null],"memo":"확인 질문 1 참고","en":{"q":"모서기 어떻게 해?","src":"Rules p.40","exp":"Read as 모아서기 (a reviewer should confirm that 모서기 means 모아서기). Rules p.40: Inner edges of both feet (발날등) together, both knees straight.","memo":"See question 1 on the Questions for you tab."}},{"id":136,"sec":"개인 코칭","q":"[결과 화면] 오늘 뭐부터 연습하면 돼?","src":"수련 기록","exp":"가장 낮은 26번째 왼 앞서기 왼 아래막기(71점)부터 시작하라고 하고, 고칠 점을 한두 가지만 분명하게 말함. 교정 내용을 전부 나열하지 않음.","ans":"오늘 총 8번의 수련을 진행하셨으며, 평균 점수는 65점입니다. 금강 품새의 집중력을 높이기 위해 격파 연습이나 호신 겨루기, 혹은 금강 품새의 주요 동작을 활용한 창작 품새를 연습해 보시는 것을 추천합니다.","pre":[null,null,null],"memo":"자료를 읽어 주기만 하지 않고 우선순위를 정하는지 봅니다. 이 시작점이 맞는지 판단해 주세요.","en":{"q":"[Report screen] 오늘 뭐부터 연습하면 돼?","src":"Practice record","exp":"Start with step 26 왼 앞서기 왼 아래막기 (71 points), give one or two clear actions, and not list every correction.","memo":"Tests whether it prioritizes, not only whether it reads data back. Please judge whether that is the right starting point."}},{"id":137,"sec":"개인 코칭","q":"[26번째 동작 상세 화면] 왜 71점이야?","src":"수련 기록","exp":"저장된 피드백(앞서기 발 간격, 힘)으로만 설명하고, 채점 이유를 지어내지 않음.","ans":"전체 기간에 수련 평균 점수가 71점인 세션이 없습니다. 기록을 다시 확인해 보시기 바랍니다.","pre":[null,null,null],"memo":"설명을 지어내는지 봅니다. 설명이 타당한지 판단해 주세요.","en":{"q":"[Detail screen, step 26] 왜 71점이야?","src":"Practice record","exp":"Explain only with the saved feedback, such as 앞서기 발 간격 and 힘, and not invent a scoring reason.","memo":"Tests whether it makes up explanations. Please judge whether the reasoning makes sense."}},{"id":138,"sec":"개인 코칭","q":"[홈 화면] 저번보다 나아졌어?","src":"수련 기록","exp":"실제 세션을 비교해 답하거나, 자료가 부족하면 그렇다고 말함.","ans":"지난 11월 4일 수련 기록을 비교해 보면, 이전 세션 34점에서 최근 세션 76점으로 42점이 올라 실력이 크게 향상되었습니다.\n\n전체적인 파워는 93점으로 매우 안정적이며, 동작의 정확도와 수행 능력이 눈에 띄게 좋아졌습니다. 다만, 17번째 동작인 오른 앞서기 오른 얼굴막기 등에서 손 자세 오류가 다소 발생하고 있으니, 손의 위치와 각도를 조금 더 세밀하게 교정하며 연습해 보시기 바랍니다. 앞으로도 지금처럼 꾸준히 수련하신다면 더욱 완성도 높은 품새를 보여주실 수 있을 것입니다.","pre":[null,null,null],"memo":"수련생이 자주 물을 질문이고, 개인 기록을 제대로 쓰는지 보는 핵심 문항입니다.","en":{"q":"[Home screen] 저번보다 나아졌어?","src":"Practice record","exp":"Compare real sessions, or say there isn't enough data.","memo":"Students are likely to ask this, and it is a key test of personal records."}},{"id":139,"sec":"태권도 지식","q":"오른 뒷굽이면 어느 발이 뒤에 있어?","src":"경기규칙 p.39","exp":"어느 발이 뒤인지 한 문장으로 분명하게 답함: 오른 뒷굽이는 오른발이 뒤(규칙 39쪽).","ans":"오른 뒷굽이에서는 오른발이 뒤에 위치합니다. 뒷굽이는 중심을 뒤쪽 다리에 두는 서기 자세입니다.","pre":[null,null,null],"memo":"좌우 혼동의 원인을 직접 확인합니다.","en":{"q":"오른 뒷굽이면 어느 발이 뒤에 있어?","src":"Rules p.39","exp":"Give the side in one clear sentence: in 오른 뒷굽이 the right foot is behind (Rules p.39).","memo":"Tests the root cause of the left and right confusion directly."}},{"id":140,"sec":"태권도 지식","q":"태극 3장 기합이 35번째야, 20동작이야?","src":"태극 3장 자료","exp":"앱 번호(35번째)와 국기원 번호(20동작)가 서로 다른 번호 체계라고 설명하고, 어느 쪽도 틀렸다고 하지 않음. 태극 3장 자료: 35번째(국기원 20동작) 왼 지르기에서 기합.","ans":"태극 3장의 35번째 동작은 국기원 기준 20번째 동작이며, 이 동작에서 기합을 넣습니다. 두 표현 모두 같은 동작을 가리키는 것이니 참고하시기 바랍니다.","pre":[null,null,null],"memo":"앱은 35번째, 자료는 국기원 20동작이라고도 합니다. 수련생과 지도자가 서로 다른 번호를 쓸 수 있습니다.","en":{"q":"태극 3장 기합이 35번째야, 20동작이야?","src":"Taegeuk 3 file","exp":"Explain that the app's numbering (step 35) and Kukkiwon's (movement 20) differ, without calling either wrong. Taegeuk 3 file: the kihap is on 왼 지르기, step 35 (Kukkiwon movement 20).","memo":"The app says step 35, while the source also says Kukkiwon movement 20. Students and instructors may use different numbers."}},{"id":141,"sec":"문서 밖 상황","q":"태극 3장 몇 점이면 승급 심사 합격해?","src":"자료 없음","exp":"앱 점수는 공식 심사 결과가 아니라고 말하고 지도 사범에게 확인하라고 안내함. 합격 점수를 지어내지 않음.","ans":"태권도 승급 심사 합격 기준 점수는 국기원 심사 규정에 따라 다르며, 제가 안내해 드리는 점수는 수련 과정의 참고 자료일 뿐입니다. 9월 9일 태극 3장 심사에서는 87점을 기록하셨습니다.","pre":[null,null,null],"memo":"합격 점수를 지어내거나 잘못 약속하지 않는지 봅니다.","en":{"q":"태극 3장 몇 점이면 승급 심사 합격해?","src":"Not in the documents","exp":"Say the app's score isn't an official exam result and refer them to their instructor. No invented pass mark.","memo":"Prevents invented pass marks and false promises."}},{"id":142,"sec":"문서 밖 상황","q":"일곱 살 아이도 앞굽이 보폭이 똑같아?","src":"자료 없음","exp":"자료에 없는 내용이라고 말하고 지도자에게 물어보라고 안내함.","ans":"앞굽이의 보폭은 신체 조건과 관계없이 두 발의 길이를 한 걸음 반 정도로 하는 것이 기본 기준입니다. 일곱 살 아이도 이 기준에 맞춰 수련하는 것이 좋습니다.","pre":[null,null,null],"memo":"자료에 없는 어린이 지도 방법이 있으면 ③에 적어 주세요.","en":{"q":"일곱 살 아이도 앞굽이 보폭이 똑같아?","src":"Not in the documents","exp":"Say what the documents don't cover, and suggest asking an instructor.","memo":"If you have guidance for children that isn't in the documents, please write it in ③."}},{"id":143,"sec":"음성·수련생 경험","q":"태극 삼장 여덟 번째 동작 뭐였지?","src":"태극 3장 자료","exp":"말로 한 숫자(삼장, 여덟 번째)를 바르게 알아듣고 왼 앞굽이 왼 지르기라고 답함.","ans":"태극 3장의 8번째 동작은 왼 앞굽이 왼 지르기입니다. 앞차기 한 왼발을 앞으로 내려놓으며 왼 앞굽이를 만들고 동시에 왼 주먹으로 지르기를 수행합니다.","pre":[null,null,null],"memo":"제품은 음성으로 쓰는데, 지금까지의 질문은 대부분 글말 형식입니다.","en":{"q":"태극 삼장 여덟 번째 동작 뭐였지?","src":"Taegeuk 3 file","exp":"Read the spoken numbers correctly and answer 왼 앞굽이 왼 지르기.","memo":"The product is voice-based, but the current questions are mostly written in standard text form."}},{"id":144,"sec":"음성·수련생 경험","q":"[결과 화면] 점수가 낮아서 그만하고 싶어","src":"수련 기록","exp":"격려하고, 실제 잘한 점이나 다음 단계를 하나 말하며, 훈계하지 않음.","ans":"태권도 수련을 하다 보면 점수가 마음처럼 나오지 않아 속상할 때가 있습니다. 하지만 이번 수련에서 평균 88점이라는 좋은 성적을 거두셨으니, 조금만 더 힘내서 연습해 보시면 분명 더 좋은 결과가 있을 거예요.","pre":[null,null,null],"memo":"규칙 질문으로는 볼 수 없는 코칭 말투를 봅니다. 어떻게 답하실지 ③에 적어 주세요.","en":{"q":"[Report screen] 점수가 낮아서 그만하고 싶어","src":"Practice record","exp":"Respond supportively, mention one real strength or next step, and not lecture.","memo":"Tests coaching tone, which rule questions can't measure. Please write how you would respond in ③."}}],"h2":["번호","주제","관련 문항","질문","검토자 답변","근거 자료(있으면)"],"w2":[7,18,16,66,48,24],"asks":[{"topic":"모서기","rows":"135","text":"\"모서기\"는 모아서기의 오타나 줄임말입니까, 별도의 용어입니까?"}],"h3":["주제","수련생이 자주 묻는 질문","권장 답변","출처"],"w3":[28,44,58,22],"topics":["태극 1장 동작 방법","태극 2장 동작 방법",null,null,null,null,null],"en":{"guide":[{"a":"Review of Taekwondo AI Coaching Answers","b":""},{"a":"Please check whether the AI coach's answers follow Taekwondo standards and help trainees. There are 144 questions to review.","b":""},{"a":"Reviewer","b":""},{"a":"Reviewer ID (e.g. R001)","b":""},{"a":"Steps","b":""},{"a":"1. Answer review","b":"Fill in the yellow cells for each question. You do not need to check record values such as scores and dates."},{"a":"2. Questions for you","b":"Answer the questions that need your judgement, such as terminology."},{"a":"3. Add questions","b":"Add questions that trainees often ask but are missing from the list."},{"a":"Save for now","b":"Your entries are saved in this browser only. You can close the page and continue later in the same browser. They will not appear on other devices or browsers."},{"a":"4. Submit results","b":"When you finish, press Submit results. Your results are sent to the development team by email. If that fails, download the Excel file and send it instead."},{"a":"What to fill in","b":""},{"a":"① System answer","b":"Choose whether the AI's actual answer follows Taekwondo standards."},{"a":"② Wording","b":"Choose whether the wording is easy for trainees to understand and suits coaching."},{"a":"③ Corrected wording","b":"If you chose something that needs changing in ①–②, write the correct wording."},{"a":"Choices","b":"①: Correct / Mostly correct / Missing content / Unneeded content / Needs edit / Wrong / Not sure\n②: Suitable / Mostly suitable / Too difficult / Too long / Too short / Change tone / Not suitable"},{"a":"Sources","b":""},{"a":"Rules","b":"2026 Poomsae Competition Rules. Pages are shown like \"p.38\"."},{"a":"KTA","b":"KTA grade materials. Grades are shown like \"KTA grade 8\"."},{"a":"Expected answer","b":"Expected answers are a reference and can be wrong. If one is wrong, write the correct wording in ③."},{"a":"Example (not a real rating)","b":""},{"a":"Question","b":"앞서기 뒷발 각도는 몇 도야?"},{"a":"① System answer","b":"Correct"},{"a":"② Wording","b":"Change tone"},{"a":"③ Corrected wording","b":"Keep the inner angle of the back foot at about 30° in 앞서기."},{"a":"How this was tested","b":""},{"a":"How the questions were run","b":"The app was started from main.py by a test driver that logs in and moves between screens."},{"a":"Every question and answer","b":"203 questions about practice records and Taekwondo knowledge, tested on 2026-11-04 on the development PC (RTX 5080). This page's 144 questions are among them. Questions were entered as text, not voice, and spoken output was ignored."},{"a":"Run time","b":"1.4–3.6 seconds per question, from entering the question to the finished answer."},{"a":"Documents in the system","b":""},{"a":"Documents","b":"2026 Poomsae Competition Rules\n2026 Breaking Competition Rules\n2026 Sparring Competition Rules\n2024 Second Standard Curriculum materials: commentary (해설서), character (인성), poomsae (품새), sparring (겨루기), fitness (체력), breaking and demonstration (격파시범), self-defense (호신술)"},{"a":"Main focus","b":"We focus on the 2026 Poomsae Competition Rules and the curriculum's poomsae volume. The kiosk's movement data for each Taegeuk form is also used."},{"a":"Requests","b":""},{"a":"PDF documents","b":"We would appreciate any other useful PDF documents that explain Taekwondo movements in detail. Please send them to the development team; we will use them to improve the system."},{"a":"Common terms","b":"We would also appreciate terms commonly used in Taekwondo, such as 모서기, that the documents above do not cover, so the system understands them instead of guessing. Please write them on an empty row of the Add questions tab."}],"sec":{"코칭 피드백":"Coaching feedback","서기·준비서기 기준":"Stances and ready stances","막기 기준":"Blocks","지르기·차기 높이":"Punch and kick height","품새별 높이·각도·시간":"Height, angle and time by form","문서에 수치가 없는 항목":"Figures the documents do not give","기본동작":"Basic movements","유사 용어 구분":"Similar terms","품새 동작 방법":"How to do form movements","특수 서기":"Special stances","오타 질문":"Misspelled questions","개인 코칭":"Personal coaching","태권도 지식":"Taekwondo knowledge","문서 밖 상황":"Situations outside the documents","음성·수련생 경험":"Voice and student experience"},"h1":["No.","Section","Question","Source","Expected answer","System answer","① System answer\ncorrect?","② Wording\nsuitable?","③ Corrected wording","Development team note"],"h2":["No.","Topic","Related questions","Question","Your answer","Reference (if any)"],"h3":["Topic","Question trainees often ask","Suggested answer","Source"],"asks":[{"topic":"모서기","rows":"135","text":"Is \"모서기\" a typo or short form of 모아서기, or a separate term?"}],"topics":["How to do Taegeuk 1","How to do Taegeuk 2",null,null,null,null,null]}};

let msgKey=null;

function stamp(){$('saved').textContent=S.savedAt?U().saved(new Date(S.savedAt).toLocaleTimeString(en()?'en-US':'ko-KR',{hour:'2-digit',minute:'2-digit'})):''}
function save(){if(msgKey&&msgKey[1]==='bad')say();try{S.savedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));stamp()}catch(e){say('noStore','bad')}}
function keep(){try{const x=S.savedAt;localStorage.setItem(KEY,JSON.stringify(S));S.savedAt=x}catch(e){}}
function cols(id,w){const g=$(id);g.textContent='';w.forEach(n=>{const c=el('col');c.style.width=n*7.5+'px';g.append(c)});g.parentNode.style.width=w.reduce((a,b)=>a+b*7.5,0)+'px'}
function heads(id,h){const r=$(id);r.textContent='';h.forEach(x=>r.append(el('th','',x)))}
let cur=0;
function tab(n){cur=n;U().tabs.forEach((_,i)=>{$('p'+i).hidden=i!==n;$('tb'+i).setAttribute('aria-selected',i===n)})}
const st=o=>S.r[o.id]||{};
const need=o=>[1,2].filter(n=>!o.pre[n]);
const isDone=o=>need(o).every(n=>st(o)['v'+n]);
function prog(){$('prog').textContent=U().prog(D.rows.filter(isDone).length,D.rows.length)}
function sel(o,n,h){const c=el('td','in'),s=el('select');s.setAttribute('aria-label',U().row(o.id)+' '+h.replace('\n',' '));s.append(new Option('',''));(n===2?['적합','대체로 적합','너무 어려움','너무 김','너무 짧음','말투 수정','부적합']:['정확','대체로 정확','내용 부족','불필요한 내용 있음','일부 수정','오류','판단 불가']).forEach(v=>s.append(new Option(opt(v),v)));s.value=st(o)['v'+n]||'';s.onchange=()=>{(S.r[o.id]=S.r[o.id]||{})['v'+n]=s.value;save();prog()};c.append(s);return c}
function area(label,val,fn){const c=el('td','in'),t=el('textarea');t.setAttribute('aria-label',label);t.value=val||'';t.oninput=()=>fn(t.value);c.append(t);return c}
function guide(){const p=$('p0');p.textContent='';const t=el('table','g');D.guide.forEach((g,i)=>{const e=en()?D.en.guide[i]:g,r=el('tr');
 if(g.k==='title'){r.className='lead';const c=el('td');c.colSpan=2;c.append(el('h2','',e.a));r.append(c)}
 else if(g.k==='lead'){r.className='lead';const c=el('td','',e.a);c.colSpan=2;r.append(c)}
 else if(g.k==='head'){const c=el('td','h',e.a);c.colSpan=2;r.append(c)}
 else if(g.k==='name'){const c=el('td'),i2=el('input');i2.id='reviewer';i2.setAttribute('aria-label',e.a);i2.autocomplete='username';i2.value=S.reviewer;i2.oninput=()=>{S.reviewer=i2.value;save()};c.append(i2);r.append(el('td','b',e.a),c)}
 else{r.append(el('td','b',e.a),el('td',g.ex?'ex':'',e.b))}
 t.append(r)});p.append(t)}
function review(){const h=en()?D.en.h1:D.h1,b=$('b1');cols('c1',D.w1);heads('h1',h);b.textContent='';
 D.rows.forEach(o=>{const e=en()?o.en:o,r=el('tr');o.node=r;
  [o.id,en()?D.en.sec[o.sec]:o.sec,e.q,e.src,e.exp,o.ans].forEach((v,i)=>{const c=el('td',i===0?'c':'',v);if(i===2||i===5)c.lang='ko';r.append(c)});
  [1,2].forEach(n=>r.append(o.pre[n]?el('td','gy',opt(o.pre[n])):sel(o,n,h[5+n])));
  r.append(area(U().row(o.id)+' '+U().note,st(o).fix,v=>{(S.r[o.id]=S.r[o.id]||{}).fix=v;save()}));
  r.append(el('td',o.memo?'nt':'',e.memo));b.append(r)});
 const fs=$('fs'),v=fs.value;fs.textContent='';fs.append(new Option(U().secAll,''));[...new Set(D.rows.map(o=>o.sec))].forEach(s=>fs.append(new Option(en()?D.en.sec[s]:s,s)));fs.value=v;
 const ft=$('ft'),w=ft.value;ft.textContent='';[['',U().stAll],['todo',U().todo],['done',U().done]].forEach(([a,l])=>ft.append(new Option(l,a)));ft.value=w;$('fq').placeholder=U().find;fs.setAttribute('aria-label',h[1]);filter()}
function filter(){const a=$('fs').value,b=$('ft').value,t=$('fq').value.trim();let n=0;D.rows.forEach(o=>{const hit=(!a||o.sec===a)&&(!b||(b==='done')===isDone(o))&&(!t||String(o.id)===t||o.q.includes(t));o.node.style.display=hit?'':'none';if(hit)n++});$('cnt').textContent=U().count(n)}
function asks(){cols('c2',D.w2);heads('h2',en()?D.en.h2:D.h2);const b=$('b2');b.textContent='';D.asks.forEach((q,i)=>{const e=en()?D.en.asks[i]:q,r=el('tr');[i+1,e.topic,e.rows,e.text].forEach((v,j)=>r.append(el('td',j===0?'c':'',v)));
 ['a','src'].forEach(k=>r.append(area((en()?D.en.h2[1]:D.h2[1])+' '+(i+1)+' '+(k==='a'?U().ans:U().src),(S.a[i]||{})[k],v=>{(S.a[i]=S.a[i]||{})[k]=v;save()})));b.append(r)})}
function adds(){cols('c3',D.w3);heads('h3',en()?D.en.h3:D.h3);const b=$('b3');b.textContent='';D.topics.forEach((t,i)=>{const r=el('tr'),set=k=>v=>{(S.add[i]=S.add[i]||{})[k]=v;save()},s=S.add[i]||{},l=(i+1)+' ';
 r.append(t?el('td','',en()?D.en.topics[i]:t):area(l+U().at,s.topic,set('topic')));
 r.append(area(l+U().aq,s.q,set('q')),area(l+U().aa,s.ans,set('ans')),area(l+U().as,s.src,set('src')));b.append(r)})}
function render(){document.documentElement.lang=S.lang;document.title=U().title;$('ttl').textContent=U().title;$('tmp').textContent=U().tmp;$('dl').textContent=U().dl;$('submit').textContent=U().submit;
 $('lko').setAttribute('aria-pressed',!en());$('len').setAttribute('aria-pressed',en());
 const nav=$('tabs');nav.textContent='';U().tabs.forEach((l,i)=>{const b=el('button','',l);b.id='tb'+i;b.type='button';b.setAttribute('role','tab');b.onclick=()=>tab(i);nav.append(b)});
 guide();review();asks();adds();prog();stamp();tab(cur);if(msgKey)say(...msgKey)}
function lang(l){if(l===S.lang)return;S.lang=l;keep();render()}
// xlsx: 원본 파일의 셀에 값만 넣어 서식을 그대로 유지
const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
function clean(v){return String(v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f￾￿]/g,'')}
function lines(t,w){return t.split('\n').reduce((a,p)=>a+Math.max(1,Math.ceil([...p].reduce((n,c)=>n+(c.codePointAt(0)>0x2000?2:1),0)/(w*.92))),0)}
async function patch(zip,path,cells){
 const f=zip.file(path),doc=new DOMParser().parseFromString(await f.async('string'),'application/xml');
 const map={};for(const c of doc.getElementsByTagNameNS(NS,'c'))map[c.getAttribute('r')]=c;
 cells.forEach(([ref,v,w])=>{if(v==null||v==='')return;const c=map[ref];if(!c)throw new Error('cell '+ref);
  while(c.firstChild)c.removeChild(c.firstChild);c.setAttribute('t','inlineStr');
  const is=doc.createElementNS(NS,'is'),t=doc.createElementNS(NS,'t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=clean(v);is.append(t);c.append(is);
  if(w){const r=c.parentNode,h=lines(String(v),w)*16+6,o=parseFloat(r.getAttribute('ht')||0);if(h>o){r.setAttribute('ht',Math.min(h,400));r.setAttribute('customHeight','1')}}});
 let x=new XMLSerializer().serializeToString(doc);if(!x.startsWith('<?xml'))x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+x;zip.file(path,x)}
async function buildZip(){const bin=Uint8Array.from(atob(XLSX_B64),c=>c.charCodeAt(0)),zip=await JSZip.loadAsync(bin);
 await patch(zip,'xl/worksheets/sheet1.xml',[[D.nameCell,S.reviewer]]);
 const c1=[];D.rows.forEach((o,i)=>{const n=i+2,s=st(o);['G','H'].forEach((L,k)=>{if(!o.pre[k+1])c1.push([L+n,s['v'+(k+1)]])});c1.push(['I'+n,s.fix,36])});
 await patch(zip,'xl/worksheets/sheet2.xml',c1);
 const c2=[];D.asks.forEach((_,i)=>{const s=S.a[i]||{};c2.push(['E'+(i+2),s.a,48],['F'+(i+2),s.src,24])});
 await patch(zip,'xl/worksheets/sheet3.xml',c2);
 const c3=[];D.topics.forEach((t,i)=>{const s=S.add[i]||{},n=i+2;if(!t)c3.push(['A'+n,s.topic,28]);c3.push(['B'+n,s.q,44],['C'+n,s.ans,58],['D'+n,s.src,22])});
 await patch(zip,'xl/worksheets/sheet4.xml',c3);return zip}
const FILE='taekwondo_review.xlsx';
async function exportXlsx(){const b=$('dl');b.disabled=true;say();
 try{const zip=await buildZip(),blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const u=URL.createObjectURL(blob),a=el('a');a.href=u;a.download=FILE;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)
 }catch(e){say('noXlsx','bad')}
 b.disabled=false}
async function submit(){const b=$('submit'),id=S.reviewer.trim(),rows=[];
 if(!id){say('needId','bad');return}
 D.rows.forEach(o=>{const s=st(o);if(!(s.v1||s.v2||(s.fix||'').trim()))return;
  rows.push({id:String(o.id),question:o.q,section:o.sec,rating:null,note:['기대 답변: -','시스템 답변: '+(o.pre[1]||s.v1||'-'),'표현: '+(o.pre[2]||s.v2||'-'),'수정 문구: '+((s.fix||'').trim()||'-')].join(' | ')})});
 D.asks.forEach((q,i)=>{const s=S.a[i]||{};if(s.a||s.src)rows.push({id:'확인'+(i+1),question:q.topic,rating:null,note:(s.a||'')+(s.src?' | 근거: '+s.src:'')})});
 D.topics.forEach((t,i)=>{const s=S.add[i]||{},k=t||s.topic||'';if(s.q||s.ans||s.src)rows.push({id:'추가'+(i+1),question:(k?k+': ':'')+(s.q||''),rating:null,note:(s.ans||'')+(s.src?' | 출처: '+s.src:'')})});
 if(!rows.length){say('needRow','bad');return}
 b.disabled=true;say('sending');
 try{let xlsx='';try{xlsx=await (await buildZip()).generateAsync({type:'base64',compression:'DEFLATE'})}catch(e){}
  const r=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({reviewer:id,page:'태권도 AI 코칭 답변 검토',total:D.rows.length,sent:new Date().toISOString(),rows,pdf:'',xlsx,xlsxName:FILE})}),j=await r.json();
  if(!j||!j.ok)throw 0;say('sent','ok',rows.length)
 }catch(e){say('fail','bad')}
 b.disabled=false}
$('fs').onchange=filter;$('ft').onchange=filter;$('fq').oninput=filter;
$('lko').onclick=()=>lang('ko');$('len').onclick=()=>lang('en');
$('tmp').onclick=save;$('dl').onclick=exportXlsx;$('submit').onclick=submit;
cur=S.reviewer?1:0;render();if(!storeOk)say('noStore','bad');
</script>
