?", "src": "Rules p.52", "exp": "Rules p.52, Taegeuk 7: when the left foot is in front, the left hand is below, and the block crosses at the forearm near the wrist (팔목).", "memo": ""}}, {"id": 120, "sec": "품새 동작 방법", "q": "태극 6장 아래 헤쳐 막기 어떻게 해?", "src": "경기규칙 p.50", "exp": "태극 6장: (아래) 헤쳐막기 동작은 두 손을 교차해 5초 정도 한다. 단전을 지나쳐 헤쳐 막는다.", "ans": "태극 6장의 아래 헤쳐 막기는 나란히 서기 자세에서 두 손을 교차한 뒤 아래로 벌리며 수행하는 동작입니다. 이 동작은 단전을 지나치며 양쪽 아래 방향의 공격을 풀어내는 느낌으로 5초 정도 유지해야 합니다. 이때 헤쳐 막는 손이 단전에서 한 주먹 이상 벗어나면 감점될 수 있으니 주의해야 합니다. 동작을 너무 빠르게 하거나 지나치게 늦게 하지 않도록 일정한 속도를 유지하는 것이 중요합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 6장 아래 헤쳐 막기 어떻게 해?", "src": "Rules p.50", "exp": "Rules p.50, Taegeuk 6: cross the hands and take about 5 seconds, parting them past the lower abdomen (단전).", "memo": ""}}, {"id": 121, "sec": "품새 동작 방법", "q": "태극 8장 당겨 턱 지르기 감점 사항", "src": "경기규칙 p.53", "exp": "태극 8장 주요 감점사항: 막기 후 옮겨 딛기를 하지 않고 바로 지를 경우. 당겨(턱) 지르기 시 허리에서 시작하는 경우. 당겨(턱) 지르기를 빠르게 하거나 또는 마지막에 끊어 치는 경우. 당긴 손의 메주먹이 어깨선에 위치하지 않는 경우.", "ans": "태극 8장의 당겨 턱 지르기 동작에서 발생하는 주요 감점 사항은 다음과 같습니다. 우선 막기 동작을 수행한 후 옮겨 딛기를 하지 않고 바로 지를 경우 감점됩니다. 또한 당겨 턱 지르기를 할 때 허리에서 동작을 시작하는 경우도 감점 대상입니다. 동작을 빠르게 수행하거나 마지막에 끊어 치는 경우에도 감점됩니다. 마지막으로 당긴 손의 메주먹이 어깨선에 위치하지 않는 경우에도 감점 사항에 해당합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 8장 당겨 턱 지르기 감점 사항", "src": "Rules p.53", "exp": "Rules p.53, Taegeuk 8, deductions: punching straight after the block without shifting the feet; starting 당겨 지르기 from the waist; doing it fast, or cutting it off at the end; the pulled hand's hammer fist not at the shoulder line.", "memo": ""}}, {"id": 122, "sec": "품새 동작 방법", "q": "태극 4장 제비품 안치기 어떻게 해?", "src": "경기규칙 p.47", "exp": "태극 4장: 한 손날 올려 막기와 손날안치기는 동시에 이루어져야 한다. 손날안치기의 높이는 목 높이로 한다.", "ans": "태극 4장의 제비품 안치기는 한 손날 올려 막기와 손날 안치기가 동시에 이루어지는 동작입니다. 손날 안치기의 높이는 본인의 목 높이에 맞춰 정확하게 수행해야 합니다. 이때 목을 치는 손을 밀거나 찌르는 형태로 동작하면 감점 요인이 되며 팔굽을 완전히 펴는 것도 주의해야 합니다. 왼 앞굽이 자세를 단단히 유지하면서 오른손으로 목 높이를 치고 왼팔은 얼굴 위쪽을 보호하는 제비품 자세를 완성하십시오.", "pre": [null, null, null], "memo": "확인 질문 7 참고", "en": {"q": "태극 4장 제비품 안치기 어떻게 해?", "src": "Rules p.47", "exp": "Rules p.47, Taegeuk 4: the one-hand knife hand upward block and 손날안치기 happen together. 손날안치기 is at neck height.", "memo": "See question 7 on the Questions for you tab."}}, {"id": 123, "sec": "품새 동작 방법", "q": "태극 7장 등주먹 바깥치기 감점 사항", "src": "경기규칙 p.52", "exp": "태극 7장 주요 감점사항: 높이가 인중선에서 지나치게 벗어나는 경우.", "ans": "태극 7장의 등주먹 바깥치기 동작에서 가장 중요한 감점 사항은 등주먹의 높이가 인중선에서 지나치게 벗어나는 경우입니다. 이 동작은 등주먹을 인중 높이로 정확하게 바깥쪽을 향해 쳐야 합니다. 높이가 인중선보다 너무 높거나 낮으면 감점 요인이 됩니다. 따라서 동작을 수행할 때 등주먹의 위치가 인중선에 오도록 주의해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 등주먹 바깥치기 감점 사항", "src": "Rules p.52", "exp": "Rules p.52, Taegeuk 7, deductions: the height far from the philtrum (인중) line.", "memo": ""}}, {"id": 124, "sec": "품새 동작 방법", "q": "태극 8장 외산틀막기 할 때 주의할 점", "src": "경기규칙 p.53", "exp": "태극 8장 주요 감점사항: 두 발 모양이 모앞굽이 자세가 되지 않을 경우. 바깥 막는 주먹의 높이가 머리 위로 올라갈 경우. 외산틀막기를 천천히 하는 경우.", "ans": "태극 8장의 외산틀막기를 할 때는 두 발 모양이 모앞굽이 자세가 되어야 하며, 바깥 막는 주먹의 높이가 머리 위로 올라가지 않도록 주의해야 합니다. 또한 외산틀막기를 천천히 하지 말고 허리 회전을 이용하여 정확하게 동작을 수행해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 8장 외산틀막기 할 때 주의할 점", "src": "Rules p.53", "exp": "Rules p.53, Taegeuk 8, deductions: the feet not in 모앞굽이; the fist of the outward block above the head; doing 외산틀막기 slowly.", "memo": ""}}, {"id": 125, "sec": "품새 동작 방법", "q": "태극 7장 표적차기 팔굽표적치기 어떻게 해?", "src": "경기규칙 p.52", "exp": "태극 7장: 표적차기는 발날등으로 찬다. 표적차기는 얼굴 높이로 차야 한다. 주춤서기 팔굽 표적치기는 명치 높이로 한다.", "ans": "태극 7장의 표적차기와 팔굽표적치기는 정확한 높이와 발의 사용이 중요합니다. 표적차기는 발날등을 사용하여 얼굴 높이까지 차야 하며, 이때 표적을 만든 손이 움직이지 않도록 주의해야 합니다. 이어서 주춤서기로 내려서며 수행하는 팔굽표적치기는 명치 높이로 정확하게 타격해야 합니다. 팔굽표적치기를 할 때는 시선이 반드시 진행 방향을 향해야 하며, 주춤서기 시 발을 짓찧듯이 서지 않도록 유의하세요. 표적차기 후 팔굽표적치기까지의 연결 동작에서 몸의 중심을 잘 잡는 것이 표현력의 핵심입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 표적차기 팔굽표적치기 어떻게 해?", "src": "Rules p.52", "exp": "Rules p.52, Taegeuk 7: 표적차기 kicks with the foot's inner edge (발날등), at face height. 주춤서기 팔굽 표적치기 is at solar plexus (명치) height.", "memo": ""}}, {"id": 126, "sec": "품새 동작 방법", "q": "태극 7장 보주먹 감점 사항", "src": "경기규칙 p.51", "exp": "태극 7장 주요 감점사항: 모아서기가 먼저 이루어지지 않고 서기와 손동작이 동시에 이루어질 경우.", "ans": "태극 7장의 보주먹 동작에서 가장 주의해야 할 감점 사항은 모아서기가 먼저 이루어지지 않고 서기와 손동작이 동시에 진행되는 경우입니다. 보주먹은 왼발을 끌어 모둠발로 서며 인중 높이까지 천천히 올리는 동작인데, 이때 서기와 손동작이 따로 놀지 않도록 주의해야 합니다. 또한 보주먹은 오른 주먹을 왼손으로 감싸는 형태를 정확히 유지해야 하며, 급하게 올리지 않고 호흡을 조절하며 정리하는 것이 중요합니다. 초보자의 경우 팔을 너무 높이 들지 않도록 인중 높이를 기준으로 삼아 정확한 위치를 지키는 것이 좋습니다.", "pre": [null, null, null], "memo": "확인 질문 8 참고", "en": {"q": "태극 7장 보주먹 감점 사항", "src": "Rules p.51", "exp": "Rules p.51, Taegeuk 7, deductions: the stance and hands moving together, instead of 모아서기 first.", "memo": "See question 8 on the Questions for you tab."}}, {"id": 127, "sec": "품새 동작 방법", "q": "태극 5장 등주먹 앞치고 안막기 어떻게 해?", "src": "경기규칙 p.48", "exp": "태극 5장: 등주먹 앞치기 하고 안막기 할 때 막았던 손의 힘을 빼고 자연스러운 손목 회전이 이루어진 후 장골능에 위치한다.", "ans": "태극 5장의 등주먹 앞치고 안막기 동작은 등주먹 앞치기를 한 뒤 막았던 손의 힘을 빼고 자연스럽게 손목을 회전하여 장골 능에 위치시킨 후 안막기를 수행합니다. 이 과정에서 빠르게 연결하는 동작 중에 손목 회전을 자연스럽게 표현하는 것이 중요합니다. 만약 등주먹 앞치기와 몸통막기가 바르게 이루어지지 않으면 감점 요인이 될 수 있습니다. 태극 5장의 13번째 동작인 오른 안막기는 왼 앞굽이 자세를 유지하며 수행하며, 왼발 앞차기와 왼 얼굴 등주먹 앞치기 이후 하나의 흐름으로 이어집니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 5장 등주먹 앞치고 안막기 어떻게 해?", "src": "Rules p.48", "exp": "Rules p.48, Taegeuk 5: after 등주먹 앞치기, when doing 안막기, relax the blocked hand; after a natural wrist turn it rests at the iliac crest (장골능).", "memo": ""}}, {"id": 128, "sec": "품새 동작 방법", "q": "태극 7장 가위막기 어떻게 해?", "src": "경기규칙 p.51", "exp": "태극 7장: 가위막기는 아래막기와 바깥막기의 방법을 적용하여 가슴에서 교차하여 막는다.", "ans": "태극 7장의 가위막기는 아래막기와 바깥막기의 방법을 적용하여 가슴에서 교차한 뒤 동시에 막는 동작입니다. 가위막기를 수행할 때는 안 팔목 바깥막기가 몸의 끝선을 벗어나지 않도록 주의해야 합니다. 또한 가위막기를 등주먹 앞치기처럼 하지 않도록 정확한 막기 궤적을 유지하는 것이 중요합니다. 태극 7장의 16번째와 18번째 동작에서 각각 왼 앞굽이와 오른 앞굽이 자세를 유지하며 수행하게 됩니다. 반복 동작 시에는 하체가 흔들리지 않게 고정하고 두 팔이 동시에 끝나도록 연습하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 가위막기 어떻게 해?", "src": "Rules p.51", "exp": "Rules p.51, Taegeuk 7: using the methods of 아래막기 and 바깥막기, the arms cross at the chest and block.", "memo": ""}}, {"id": 129, "sec": "품새 동작 방법", "q": "태극 8장 외산틀막기 어떻게 해?", "src": "경기규칙 p.53", "exp": "태극 8장: 앞굽이는 일직선상에서 발끝이 측면 쪽으로 약간 틀어진 상태. (모앞굽이 자세)", "ans": "태극 8장의 외산틀막기는 앞굽이 자세에서 몸을 옆선으로 전환하며 두 팔로 산 모양의 틀을 만드는 동작입니다. 앞굽이는 일직선상에서 발끝이 측면 쪽으로 약간 틀어진 모앞굽이 자세를 유지해야 합니다. 한 팔은 위쪽을 막고 다른 팔은 아래쪽이나 몸통 쪽을 막으며 허리 회전을 이용해 힘을 전달합니다. 바깥 막는 주먹의 높이가 머리 위로 올라가면 감점될 수 있으니 주의해야 합니다. 외산틀막기를 할 때는 동작을 천천히 하지 말고 정확하게 수행하는 것이 중요합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 8장 외산틀막기 어떻게 해?", "src": "Rules p.53", "exp": "Rules p.53, Taegeuk 8: 앞굽이 in a straight line, with the toes turned slightly to the side (모앞굽이).", "memo": ""}}, {"id": 130, "sec": "특수 서기", "q": "학다리서기는 어떻게 해?", "src": "경기규칙 p.40", "exp": "중심 발은 주춤서기 높이로 한다. 붙이는 발은 발날등을 중심 발 무릎 안쪽에 자연스럽게 힘을 빼고 붙인다. 든 발의 무릎이 앞을 향하도록 조여야 한다.", "ans": "학다리서기는 모아서기에서 두 무릎을 구부려 자세를 낮춘 상태에서 시작합니다. 왼발을 엘리베이터가 올라가듯 오른발 무릎 안쪽까지 올린 뒤 발날등을 가볍게 붙여야 합니다. 이때 중심이 되는 발은 주춤서기 높이로 유지하고 든 발의 무릎이 앞을 향하도록 조여야 합니다. 시선은 정면을 보고 턱을 가볍게 당겨 몸의 안정성을 유지하는 것이 중요합니다. 무릎이 펴지거나 벌어지는 경우 감점될 수 있으니 주의하며 연습하시기 바랍니다.", "pre": [null, null, null], "memo": "확인 질문 8 참고", "en": {"q": "학다리서기는 어떻게 해?", "src": "Rules p.40", "exp": "Rules p.40: The supporting foot is at 주춤서기 height. The other foot's inner edge (발날등) rests, relaxed, against the inside of the supporting knee. The raised knee is drawn in so it faces forward.", "memo": "See question 8 on the Questions for you tab."}}, {"id": 131, "sec": "특수 서기", "q": "오른서기가 뭐야?", "src": "경기규칙 p.39", "exp": "나란히서기와 모두 같으나 다만 한발은 제자리, 반대 발은 틀어 앞축을 90°로 돌려 딛는다.", "ans": "태권도에서 오른서기는 오른발을 앞으로 내디뎌 서는 자세를 말합니다. 앞서기나 뒷굽이 등 다양한 서기 동작에서 오른발이 앞에 위치할 때 오른서기라고 부릅니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 오른서기를 오른발이 앞에 있는 서기로 설명함. 기대 답변만 확인해 주세요.", "en": {"q": "오른서기가 뭐야?", "src": "Rules p.39", "exp": "Rules p.39: the same as 나란히서기, except that one foot stays and the other turns so the ball of the foot is rotated 90°.", "memo": "Known error: describes 오른서기 as a stance with the right foot in front. Please check the expected answer only."}}, {"id": 132, "sec": "특수 서기", "q": "나란히서기 발 간격은?", "src": "KTA 9급 서기 1단계", "exp": "모아선 상태에서 왼발을 옆으로 90° 열어 '한발' 옮기고, 그 간격을 유지하며 나란하게 선다.", "ans": "나란히서기의 발 간격은 한 발 길이로 넓혀서야 합니다. 발 간격이 이보다 좁거나 넓으면 감점 요인이 됩니다.", "pre": [null, null, null], "memo": "", "en": {"q": "나란히서기 발 간격은?", "src": "KTA grade 9 stances step 1", "exp": "KTA grade 9, stances step 1: from standing feet together, open the left foot 90° to the side, move it one foot's length, and keep that gap with the feet parallel.", "memo": ""}}, {"id": 133, "sec": "특수 서기", "q": "범서기 체중은 어디에 실어?", "src": "경기규칙 p.39", "exp": "체중을 뒷발에 90~100% 싣는다.", "ans": "범서기는 체중을 뒷발에 90에서 100퍼센트 정도 실어야 합니다. 아랫배에 힘을 주어 중심을 정확히 유지하는 것이 중요합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "범서기 체중은 어디에 실어?", "src": "Rules p.39", "exp": "Rules p.39: 90~100% on the back foot.", "memo": ""}}, {"id": 134, "sec": "특수 서기", "q": "태극 7장 보주먹은 어떤 서기로 해?", "src": "경기규칙 p.51", "exp": "모아서기. 규칙 51쪽: 왼발 끌어 모둠발로 선다.", "ans": "태극 7장의 보주먹 동작은 모아서기로 수행합니다. 중앙선에서 두 발을 모아 서서 동작을 완성하시면 됩니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 보주먹은 어떤 서기로 해?", "src": "Rules p.51", "exp": "모아서기. Rules p.51: draw the left foot in to stand with the feet together.", "memo": ""}}, {"id": 135, "sec": "오타 질문", "q": "모서기 어떻게 해?", "src": "경기규칙 p.40", "exp": "모아서기로 알아들음(모서기가 모아서기인지 지도자 확인 필요). 규칙 40쪽: 두 발날등을 모아 맞대고 두 무릎을 곧게 편 서기 동작.", "ans": "모아서기는 두 발날등을 모아 맞대고 두 무릎을 곧게 펴서 서는 동작입니다. 두 발이 벌어지지 않도록 주의하며 곧게 서는 것이 핵심입니다. 태극 7장의 14번째 동작인 모아서기 보주먹에서는 중앙선에서 두 발을 모아 서고 한 손으로 다른 주먹을 감싸 인중 높이까지 천천히 올립니다. 보주먹은 호흡을 조절하며 동작의 흐름을 정리하는 것이므로 급하게 올리지 않도록 합니다. 초보자는 팔을 너무 높이 들지 말고 인중 높이를 기준으로 맞추어 연습하시기 바랍니다.", "pre": [null, null, null], "memo": "확인 질문 6 참고", "en": {"q": "모서기 어떻게 해?", "src": "Rules p.40", "exp": "Read as 모아서기 (an instructor should confirm that 모서기 means 모아서기). Rules p.40: Inner edges of both feet (발날등) together, both knees straight.", "memo": "See question 6 on the Questions for you tab."}}], "h2": ["번호", "주제", "관련 문항", "질문", "강사 답변", "근거 자료(있으면)"], "w2": [7, 18, 16, 66, 48, 24], "asks": [{"topic": "출처 우선순위", "rows": "전체", "text": "경기규칙과 KTA 자료의 내용이 다를 때 AI 코치는 어느 쪽을 기준으로 답해야 합니까? 품새 경기와 심사 준비에 따라 기준이 달라집니까?"}, {"topic": "자료 간 높이 차이", "rows": "45, 53, 55, 61", "text": "아래 동작의 기준 높이는 무엇이 맞습니까?\n· 45 태극 3장 손날 바깥막기: 어깨(경기규칙) / 명치(KTA 6급)\n· 53 태극 6장 손날 얼굴 비틀어 막기: 얼굴(경기규칙) / 인중(KTA 3급)\n· 55 태극 6장 얼굴 바깥막기: 몸끝선(경기규칙) / 인중, 주먹은 머리끝선까지 허용(KTA 3급)\n· 61 태극 7장 표적차기: 얼굴(경기규칙) / 어깨(KTA 2급)"}, {"topic": "뒷굽이 각도", "rows": "76", "text": "뒷굽이의 60~70도, 100~110도, 두 무릎 사이 90도는 서로 어떻게 맞물립니까? 각 각도는 어느 부위를 기준으로 재야 합니까?"}, {"topic": "뒷굽이 좌우 명칭", "rows": "112", "text": "태극 6장의 이 동작에서 기대 답변은 \"오른 뒷굽이\", 시스템 답변은 \"왼 뒷굽이\"입니다. 어느 쪽이 맞습니까? 좌우는 앞발과 뒷발 중 어느 쪽을 기준으로 부릅니까?"}, {"topic": "몸통막기의 의미", "rows": "85, 96", "text": "\"몸통막기\"는 몸통 안막기를 뜻합니까, 몸통 높이의 막기 전체를 뜻합니까? 몸통 안막기를 뜻하지 않는다면 96번 질문을 어떻게 바꿔야 합니까?"}, {"topic": "모서기", "rows": "135", "text": "\"모서기\"는 모아서기의 오타나 줄임말입니까, 별도의 용어입니까?"}, {"topic": "올려막기", "rows": "105, 106, 122", "text": "105·106번은 올려막기와 내려막기를 쓰지 않는다고 답합니다. 122번 기대 답변의 \"한 손날 올려 막기\"는 사용해도 되는 표현입니까?"}, {"topic": "규칙에 없는 설명", "rows": "79, 116, 126, 130", "text": "다음과 같이 규칙 문서에 없는 설명을 AI가 덧붙여도 됩니까?\n· 130: \"엘리베이터가 올라가듯\" 같은 비유\n· 116, 126: 초보자를 위한 조언\n· 79: 0.1점, 0.3점 같은 구체적인 감점 수치"}], "h3": ["주제", "수련생이 자주 묻는 질문", "권장 답변", "출처"], "w3": [28, 44, 58, 22], "topics": ["태극 1장 동작 방법", "태극 2장 동작 방법", "태극 3장 동작 방법", "다음에 연습할 내용", "감점 이유", "시선", "호흡", "기합", "승급·승품 심사 준비", null, null, null, null, null], "en": {"guide": [{"a": "Instructor Review of Taekwondo AI Coaching Answers", "b": ""}, {"a": "Please check whether the AI coach's answers follow Taekwondo standards and help trainees. There are 135 questions to review.", "b": ""}, {"a": "Reviewer", "b": ""}, {"a": "Instructor ID", "b": ""}, {"a": "Steps", "b": ""}, {"a": "1. Instructor review", "b": "Fill in the yellow cells for each question. You do not need to check record values such as scores and dates."}, {"a": "2. Questions for you", "b": "Answer the questions that need your judgement, such as differences between documents and terminology."}, {"a": "3. Add questions", "b": "Add questions that trainees often ask but are missing from the list."}, {"a": "Save for now", "b": "Your entries are saved in this browser only. You can close the page and continue later in the same browser. They will not appear on other devices or browsers."}, {"a": "4. Submit results", "b": "When you finish, press Submit results. Your results are sent to the development team by email. If that fails, download the Excel file and send it instead."}, {"a": "What to fill in", "b": ""}, {"a": "① Expected answer", "b": "Choose whether the answer set by the development team is correct."}, {"a": "② System answer", "b": "Choose whether the AI's actual answer follows Taekwondo standards."}, {"a": "③ Wording", "b": "Choose whether the wording is easy for trainees to understand and suits coaching."}, {"a": "④ Corrected wording", "b": "If you chose something that needs changing in ①–③, write the correct wording."}, {"a": "Choices", "b": "①②: Correct / Mostly correct / Missing content / Unneeded content / Needs edit / Wrong / Not sure\n③: Suitable / Mostly suitable / Too difficult / Too long / Change tone / Not suitable"}, {"a": "Grey cells", "b": "You do not need to rate these. \"Skip\" means the development team already found an error in that answer. \"N/A\" means a coaching question with no standard answer to rate."}, {"a": "Sources", "b": ""}, {"a": "Rules", "b": "2026 Poomsae Competition Rules. Pages are shown like \"p.38\"."}, {"a": "KTA", "b": "KTA grade materials. Grades are shown like \"KTA grade 8\"."}, {"a": "Expected answer", "b": "Expected answers are a reference and can be wrong. If one is wrong, choose that in ① and write the correct wording in ④."}, {"a": "Example (not a real rating)", "b": ""}, {"a": "Question", "b": "앞서기 뒷발 각도는 몇 도야?"}, {"a": "① Expected answer", "b": "Cor   while(c.firstChild)c.removeChild(c.firstChild);c.setAttribute('t','inlineStr');
  const is=doc.createElementNS(NS,'is'),t=doc.createElementNS(NS,'t');t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=clean(v);is.append(t);c.append(is);
  if(w){const r=c.parentNode,h=lines(String(v),w)*16+6,o=parseFloat(r.getAttribute('ht')||0);if(h>o){r.setAttribute('ht',Math.min(h,400));r.setAttribute('customHeight','1')}}});
 let x=new XMLSerializer().serializeToString(doc);if(!x.startsWith('<?xml'))x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+x;zip.file(path,x)}
async function buildZip(){const bin=Uint8Array.from(atob(XLSX_B64),c=>c.charCodeAt(0)),zip=await JSZip.loadAsync(bin);
 await patch(zip,'xl/worksheets/sheet1.xml',[[D.nameCell,S.reviewer]]);
 const c1=[];D.rows.forEach((o,i)=>{const n=i+2,s=st(o);['G','H','I'].forEach((L,k)=>{if(!o.pre[k])c1.push([L+n,s['v'+k]])});c1.push(['J'+n,s.fix,36])});
 await patch(zip,'xl/worksheets/sheet2.xml',c1);
 const c2=[];D.asks.forEach((_,i)=>{const s=S.a[i]||{};c2.push(['E'+(i+2),s.a,48],['F'+(i+2),s.src,24])});
 await patch(zip,'xl/worksheets/sheet3.xml',c2);
 const c3=[];D.topics.forEach((t,i)=>{const s=S.add[i]||{},n=i+2;if(!t)c3.push(['A'+n,s.topic,28]);c3.push(['B'+n,s.q,44],['C'+n,s.ans,58],['D'+n,s.src,22])});
 await patch(zip,'xl/worksheets/sheet4.xml',c3);return zip}
const FILE='taekwondo_instructor_review.xlsx';
async function exportXlsx(){const b=$('dl');b.disabled=true;say();
 try{const zip=await buildZip(),blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const u=URL.createObjectURL(blob),a=el('a');a.href=u;a.download=FILE;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)
 }catch(e){say('noXlsx','bad')}
 b.disabled=false}
async function submit(){const b=$('submit'),id=S.reviewer.trim(),rows=[];
 if(!id){say('needId','bad');return}
 D.rows.forEach(o=>{const s=st(o);if(!(s.v0||s.v1||s.v2||(s.fix||'').trim()))return;
  rows.push({id:String(o.id),question:o.q,section:o.sec,rating:null,note:['기대 답변: '+(o.pre[0]||s.v0||'-'),'시스템 답변: '+(o.pre[1]||s.v1||'-'),'표현: '+(o.pre[2]||s.v2||'-'),'수정 문구: '+((s.fix||'').trim()||'-')].join(' | ')})});
 D.asks.forEach((q,i)=>{const s=S.a[i]||{};if(s.a||s.src)rows.push({id:'확인'+(i+1),question:q.topic,rating:null,note:(s.a||'')+(s.src?' | 근거: '+s.src:'')})});
 D.topics.forEach((t,i)=>{const s=S.add[i]||{},k=t||s.topic||'';if(s.q||s.ans||s.src)rows.push({id:'추가'+(i+1),question:(k?k+': ':'')+(s.q||''),rating:null,note:(s.ans||'')+(s.src?' | 출처: '+s.src:'')})});
 if(!rows.length){say('needRow','bad');return}
 b.disabled=true;say('sending');
 try{let xlsx='';try{xlsx=await (await buildZip()).generateAsync({type:'base64',compression:'DEFLATE'})}catch(e){}
  const r=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({reviewer:id,page:'태권도 AI 코칭 강사 검토',total:D.rows.length,sent:new Date().toISOString(),rows,pdf:'',xlsx,xlsxName:FILE})}),j=await r.json();
  if(!j||!j.ok)throw 0;say('sent','ok',rows.length)
 }catch(e){say('fail','bad')}
 b.disabled=false}
