<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태권도 AI 코칭 강사 검토</title>
<style>
:root{--navy:#1f3864;--input:#fff9e5;--grey:#ededed;--note:#fce4d6;--line:#bfbfbf;--ink:#1a1a1a;--muted:#595959}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:#fff;color:var(--ink);font:13.5px/1.6 "맑은 고딕","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--navy);color:#fff}
.top h1{font-size:16px;margin:0;flex:1 1 auto}
#prog{font-size:13px;white-space:nowrap}
.btn{font:inherit;font-weight:700;min-height:40px;padding:6px 14px;border:0;border-radius:4px;background:#ffd666;color:#1a1a1a;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.sub{background:#fff;color:var(--navy)}
#saved{font-size:13px;white-space:nowrap}
nav{display:flex;gap:2px;padding:6px 16px 0;background:#e4e8f0;overflow-x:auto;flex:none;border-bottom:1px solid var(--line)}
nav button{flex:none;font:inherit;min-height:38px;padding:6px 16px;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:#f4f5f8;cursor:pointer}
nav button[aria-selected=true]{background:#fff;font-weight:700;color:var(--navy)}
.pane{flex:1;min-height:0;overflow:auto}
.pane[hidden]{display:none}
#msg{padding:8px 16px;font-size:13.5px;background:#fce4d6;color:#8a2a12}#msg.ok{background:#e3f2ea;color:#1e6b45}#msg:empty{display:none}
.lg{display:inline-flex;border:1px solid #fff;border-radius:4px;overflow:hidden}
.lg button{font:inherit;min-height:38px;padding:4px 12px;border:0;background:transparent;color:#fff;cursor:pointer}
.lg button[aria-pressed=true]{background:#fff;color:var(--navy);font-weight:700}
/* 안내 */
#p0{padding:16px}
.g{width:100%;max-width:920px;border-collapse:collapse}
.g h2{font-size:18px;color:var(--navy);margin:0}
.g td{white-space:pre-line;border:1px solid var(--line);padding:6px 10px;vertical-align:top}
.g td.h{background:var(--navy);color:#fff;font-weight:700;font-size:14px}
.g td.b{font-weight:700;width:190px}
.g tr.gap td,.g tr.lead td{border:0;padding:6px 0}
.g input{width:100%;font:inherit;min-height:32px;padding:4px 6px;border:1px solid var(--line);background:var(--input)}
.g td.ex{background:var(--input)}
/* 표 */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 16px;position:sticky;left:0;background:#fff}
.tools select,.tools input{font:inherit;min-height:34px;padding:2px 6px;border:1px solid var(--line);border-radius:3px;max-width:100%}
.tools input{flex:0 1 240px}
.wrap{flex:1;min-height:0;overflow:auto}
#p1{display:flex;flex-direction:column;overflow:hidden}
#p1[hidden]{display:none}
table.x{border-collapse:separate;border-spacing:0;table-layout:fixed}
table.x th{position:sticky;top:0;z-index:3;background:var(--navy);color:#fff;font-weight:700;padding:8px;text-align:center;border:1px solid var(--line);border-width:1px 1px 1px 0;white-space:pre-line}
table.x td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;background:#fff;white-space:pre-line}
table.x td:first-child{border-left:1px solid var(--line)}
table.x td.c{text-align:center}
table.x td.in{background:var(--input);padding:0;position:relative;height:72px}
table.x td.gy{background:var(--grey);color:#7f7f7f;text-align:center;font-size:12px}
table.x td.nt{background:var(--note)}
td.in select{width:100%;height:38px;border:0;background:transparent;font:inherit;text-align:center;padding:0 2px}
td.in textarea{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;font:inherit;padding:8px 10px;resize:none}
td.in textarea:focus,td.in select:focus{outline:2px solid var(--navy);outline-offset:-2px}
@media (min-width:901px){
 #t1 th:nth-child(-n+3),#t1 td:nth-child(-n+3){position:sticky;z-index:1}
 #t1 th:nth-child(-n+3){z-index:4}
 #t1 th:nth-child(1),#t1 td:nth-child(1){left:0}
 #t1 th:nth-child(2),#t1 td:nth-child(2){left:53px}
 #t1 th:nth-child(3),#t1 td:nth-child(3){left:166px}
}
@media (max-width:900px){td.in textarea,td.in select{font-size:16px}#p0{padding:16px}}
</style>
</head>
<body>
<div class="top"><h1 id="ttl"></h1><span id="prog"></span><span id="saved" role="status"></span><span class="lg"><button id="lko" type="button">한국어</button><button id="len" type="button">English</button></span><button class="btn sub" id="tmp" type="button"></button><button class="btn sub" id="dl" type="button"></button><button class="btn" id="submit" type="button"></button></div>
<div id="msg" role="status"></div>
<nav id="tabs" role="tablist"></nav>
<div class="pane" id="p0"></div>
<div class="pane" id="p1" hidden>
 <div class="tools"><select id="fs" aria-label="구분"></select><select id="ft" aria-label="입력 상태"></select><input id="fq" type="search" aria-label="Search"><span id="cnt"></span></div>
 <div class="wrap"><table class="x" id="t1"><colgroup id="c1"></colgroup><thead><tr id="h1"></tr></thead><tbody id="b1"></tbody></table></div>
</div>
<div class="pane" id="p2" hidden><table class="x" id="t2"><colgroup id="c2"></colgroup><thead><tr id="h2"></tr></thead><tbody id="b2"></tbody></table></div>
<div class="pane" id="p3" hidden><table class="x" id="t3"><colgroup id="c3"></colgroup><thead><tr id="h3"></tr></thead><tbody id="b3"></tbody></table></div>

const D={"guide": [{"k": "title", "a": "태권도 AI 코칭 답변 강사 검토"}, {"k": "lead", "a": "AI 코치의 답변이 태권도 기준에 맞고 수련생에게 도움이 되는지 확인해 주세요. 검토 대상은 135개 문항입니다."}, {"k": "head", "a": "검토자"}, {"k": "name", "a": "강사 아이디"}, {"k": "head", "a": "작성 순서"}, {"k": "row", "a": "1. 강사 검토", "b": "각 문항의 노란색 칸을 작성해 주세요. 점수·날짜 등 기록 값은 검토 대상이 아닙니다.", "ex": false}, {"k": "row", "a": "2. 확인 질문", "b": "자료 간 차이나 용어처럼 강사님의 판단이 필요한 질문에 답해 주세요.", "ex": false}, {"k": "row", "a": "3. 질문 추가", "b": "수련생이 자주 묻지만 목록에 없는 질문을 적어 주세요.", "ex": false}, {"k": "row", "a": "임시 저장", "b": "입력 내용은 이 브라우저에만 저장됩니다. 창을 닫았다가 같은 브라우저에서 다시 열면 이어서 작성할 수 있습니다. 다른 기기나 브라우저에서는 보이지 않습니다.", "ex": false}, {"k": "row", "a": "4. 결과 제출", "b": "작성을 마치면 결과 제출을 눌러 주세요. 결과가 이메일로 개발팀에 전송됩니다. 제출이 안 되면 엑셀 파일을 내려받아 보내 주세요.", "ex": false}, {"k": "head", "a": "입력 항목"}, {"k": "row", "a": "① 기대 답변", "b": "개발팀이 정답으로 정한 내용이 맞는지 선택해 주세요.", "ex": false}, {"k": "row", "a": "② 시스템 답변", "b": "AI가 실제로 답한 내용이 태권도 기준에 맞는지 선택해 주세요.", "ex": false}, {"k": "row", "a": "③ 표현", "b": "수련생이 이해하기 쉽고 코칭 말투로 적절한지 선택해 주세요.", "ex": false}, {"k": "row", "a": "④ 수정 문구", "b": "①~③에서 고칠 내용이 있는 항목을 골랐다면 올바른 문구를 적어 주세요.", "ex": false}, {"k": "row", "a": "선택 값", "b": "①②: 정확 / 대체로 정확 / 내용 부족 / 불필요한 내용 있음 / 일부 수정 / 오류 / 판단 불가\n③: 적합 / 대체로 적합 / 너무 어려움 / 너무 김 / 말투 수정 / 부적합", "ex": false}, {"k": "row", "a": "회색 칸", "b": "평가하지 않아도 됩니다. \"평가 생략\"은 개발팀이 이미 오류를 확인한 답변이고, \"해당 없음\"은 기준 답변이 없는 코칭 문항입니다.", "ex": false}, {"k": "head", "a": "출처"}, {"k": "row", "a": "경기규칙", "b": "2026 태권도 품새 경기규칙. \"p.38\"처럼 쪽수를 표시했습니다.", "ex": false}, {"k": "row", "a": "KTA", "b": "KTA 급별 자료. \"KTA 8급\"처럼 급을 표시했습니다.", "ex": false}, {"k": "row", "a": "기대 답변", "b": "기대 답변은 참고용이며 틀릴 수 있습니다. 틀렸다면 ①에서 선택하고 ④에 올바른 문구를 적어 주세요.", "ex": false}, {"k": "head", "a": "입력 예시 (실제 평가가 아닙니다)"}, {"k": "row", "a": "질문", "b": "앞서기 뒷발 각도는 몇 도야?", "ex": false}, {"k": "row", "a": "① 기대 답변", "b": "정확", "ex": true}, {"k": "row", "a": "② 시스템 답변", "b": "정확", "ex": true}, {"k": "row", "a": "③ 표현", "b": "말투 수정", "ex": true}, {"k": "row", "a": "④ 수정 문구", "b": "앞서기에서 뒷발 안쪽 각도는 30도 정도로 유지하세요.", "ex": true}], "nameCell": "C6", "h1": ["번호", "구분", "질문", "출처", "기대 답변", "시스템 답변", "① 기대 답변\n정확성", "② 시스템 답변\n정확성", "③ 표현\n적합성", "④ 수정 문구", "개발팀 메모"], "w1": [7, 15, 26, 15, 46, 58, 12, 12, 12, 36, 24], "rows": [{"id": 1, "sec": "코칭 피드백", "q": "[8번째 동작 상세 화면] 이 동작 피드백 다시 말해줘", "src": "-", "exp": "8번째 동작(왼 앞굽이 왼 지르기, 84점)에 대해 답하고, 다른 동작이나 세션 전체로 넘어가지 않음.", "ans": "태극 3장의 8번째 동작인 왼 앞굽이 왼 지르기에 대한 피드백입니다. 동작 수행 등급은 좋아요이며 최종 점수는 84점입니다. 왼쪽 무릎 각도는 내 자세 176도, 기준 157도로 약 15도 더 굽혀 보시고, 몸통지르기 시 힘을 더 실어주시기 바랍니다.", "pre": ["해당 없음", null, null], "memo": "", "en": {"q": "[Detail screen, step 8] 이 동작 피드백 다시 말해줘", "src": "-", "exp": "About step 8 (왼 앞굽이 왼 지르기, 84 points), not another step or the whole session.", "memo": ""}}, {"id": 2, "sec": "코칭 피드백", "q": "[4번째 동작 상세 화면] 이 동작 어떻게 고쳐야 해?", "src": "-", "exp": "4번째 동작(오른 앞굽이 오른 지르기, 92점)에 대해 답하고, 다른 동작이나 세션 전체로 넘어가지 않음.", "ans": "오른 앞굽이 오른 지르기 동작에서 발 간격은 내 자세 어깨너비의 3.0배, 기준 어깨너비의 2.8배이므로 기준보다 9퍼센트 좁혀 보세요. 왼 무릎 각도는 내 자세 160도, 기준 164도이므로 기준보다 4도 더 펴보시고, 오른 무릎 각도는 내 자세 168도, 기준 163도이므로 기준보다 4도 더 굽혀 보세요. 왼손 높이는 내 자세 어깨 아래 31센티미터, 기준 어깨 아래 25센티미터이므로 기준보다 약 6센티미터 올려 보시고, 오른손 높이는 내 자세 어깨 아래 33센티미터, 기준 어깨 아래 19센티미터이므로 기준보다 약 13센티미터 올려 보세요.", "pre": ["해당 없음", null, null], "memo": "", "en": {"q": "[Detail screen, step 4] 이 동작 어떻게 고쳐야 해?", "src": "-", "exp": "About step 4 (오른 앞굽이 오른 지르기, 92 points), not another step or the whole session.", "memo": ""}}, {"id": 3, "sec": "코칭 피드백", "q": "[34번째 동작 상세 화면] 이 동작 피드백은?", "src": "-", "exp": "34번째 동작(오른 앞서기 오른 아래막기, 73점)에 대해 답하고, 다른 동작이나 세션 전체로 넘어가지 않음.", "ans": "가가가님의 태극 3장 34번째 동작인 오른 앞서기 오른 아래막기는 정상적으로 수행되었습니다. 막는 손의 위치가 낮으니 약 11cm 올려 기준선에 맞추고, 앞서기 발 간격도 약 10cm 더 넓혀 하체 밸런스를 안정시켜 보세요.", "pre": ["해당 없음", null, null], "memo": "", "en": {"q": "[Detail screen, step 34] 이 동작 피드백은?", "src": "-", "exp": "About step 34 (오른 앞서기 오른 아래막기, 73 points), not another step or the whole session.", "memo": ""}}, {"id": 4, "sec": "코칭 피드백", "q": "[8번째 동작 상세 화면] 여기서 제일 고칠 점은?", "src": "-", "exp": "8번째 동작(왼 앞굽이 왼 지르기, 84점)에 대해 답하고, 다른 동작이나 세션 전체로 넘어가지 않음.", "ans": "8번째 동작인 왼 앞굽이 왼 지르기에서 가장 고쳐야 할 점은 몸통지르기 시 힘 전달이 약하다는 것입니다. 동작 수행 시 힘을 더 실어서 강하게 지를 수 있도록 노력해 보세요.", "pre": ["해당 없음", null, null], "memo": "", "en": {"q": "[Detail screen, step 8] 여기서 제일 고칠 점은?", "src": "-", "exp": "About step 8 (왼 앞굽이 왼 지르기, 84 points), not another step or the whole session.", "memo": ""}}, {"id": 5, "sec": "서기·준비서기 기준", "q": "앞서기 보폭은 얼마나 돼?", "src": "경기규칙 p.38", "exp": "걸어가다 멈췄을 때의 한걸음 길이로 선다.", "ans": "앞서기는 걸어가다 멈췄을 때의 한 걸음 길이로 서는 것이 기준입니다. 보폭이 너무 넓거나 좁으면 감점 요인이 되니 주의하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞서기 보폭은 얼마나 돼?", "src": "Rules p.38", "exp": "Rules p.38: one step's length, the step you stop on when walking.", "memo": ""}}, {"id": 6, "sec": "서기·준비서기 기준", "q": "앞서기 뒷발 각도는 몇 도야?", "src": "경기규칙 p.38", "exp": "뒷발의 내각은 30° 정도. 30° 이상 벌어지면 감점.", "ans": "앞서기 동작에서 뒷발의 내각은 30도 정도로 유지하는 것이 기준입니다. 뒷발의 내각이 30도 이상 벌어지지 않도록 주의해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞서기 뒷발 각도는 몇 도야?", "src": "Rules p.38", "exp": "Rules p.38: the inner angle of the back foot is about 30°. Wider than 30° is a deduction.", "memo": ""}}, {"id": 7, "sec": "서기·준비서기 기준", "q": "앞서기 할 때 몸통은 몇 도 틀어?", "src": "경기규칙 p.38", "exp": "정면을 향한 몸통을 30° 정도 자연스럽게 틀어준다.", "ans": "앞서기를 할 때 몸통은 정면을 향한 상태에서 30도 정도 자연스럽게 틀어주어야 합니다. 이는 올바른 서기 자세를 유지하기 위한 기준입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞서기 할 때 몸통은 몇 도 틀어?", "src": "Rules p.38", "exp": "Rules p.38: turn the front-facing trunk naturally by about 30°.", "memo": ""}}, {"id": 8, "sec": "서기·준비서기 기준", "q": "앞서기 체중은 어디에 실어?", "src": "경기규칙 p.38", "exp": "두 무릎을 펴고 체중을 두 다리에 균일하게 싣는다.", "ans": "앞서기는 두 무릎을 펴고 체중을 두 다리에 균일하게 실어야 합니다. 몸을 반듯하게 세우고 정면을 향한 몸통은 30도 정도 자연스럽게 틀어주어야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞서기 체중은 어디에 실어?", "src": "Rules p.38", "exp": "Rules p.38: with both knees straight, the weight is spread evenly on both legs.", "memo": ""}}, {"id": 9, "sec": "서기·준비서기 기준", "q": "앞서기 두 발 좌우 넓이는?", "src": "KTA 8급", "exp": "앞서기 발과 발 사이는 발 하나의 간격.", "ans": "앞서기는 걸어가다 멈췄을 때의 한 걸음 길이로 서며, 두 무릎을 펴고 체중을 두 다리에 균일하게 실어야 합니다. 보폭이 너무 넓거나 좁으면 감점 요인이 되니 주의하시기 바랍니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 좌우 넓이 대신 보폭을 답함. 기대 답변만 확인해 주세요.", "en": {"q": "앞서기 두 발 좌우 넓이는?", "src": "KTA grade 8", "exp": "KTA grade 8: one foot's width between the feet.", "memo": "Known error: answers with step length instead of side-to-side width. Please check the expected answer only."}}, {"id": 10, "sec": "서기·준비서기 기준", "q": "앞굽이 좌우 넓이는?", "src": "KTA 9급", "exp": "뒤축 사이를 주먹 하나의 간격으로 유지한다.", "ans": "앞굽이의 두 발 길이는 한 걸음 반 정도로 합니다. 보폭이 너무 넓어 허리와 골반부가 서기와 균형을 이루지 못하면 감점될 수 있습니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 좌우 넓이 대신 보폭을 답함. 기대 답변만 확인해 주세요.", "en": {"q": "앞굽이 좌우 넓이는?", "src": "KTA grade 9", "exp": "KTA grade 9: keep one fist's width between the heels.", "memo": "Known error: answers with step length instead of side-to-side width. Please check the expected answer only."}}, {"id": 11, "sec": "서기·준비서기 기준", "q": "범서기 뒷발 각도는 몇 도야?", "src": "경기규칙 p.39", "exp": "뒷발을 30° 정도의 각으로 넓혀 선다.", "ans": "범서기에서 뒷발은 30도 정도의 각으로 넓혀 서야 합니다. 이는 모아서기에서 발을 벌려 서는 기준입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "범서기 뒷발 각도는 몇 도야?", "src": "Rules p.39", "exp": "Rules p.39: the back foot opens about 30°.", "memo": ""}}, {"id": 12, "sec": "서기·준비서기 기준", "q": "범서기 보폭은 얼마나 돼?", "src": "경기규칙 p.39", "exp": "앞발을 뒷발 끝에서 한발 길이로 내딛는다.", "ans": "범서기의 보폭은 모아서기에서 한 발을 내디뎠을 때 뒷발 끝에서 앞발 끝까지 한 발 길이로 서는 것이 기준입니다. 보폭이 너무 짧거나 길면 감점 요인이 될 수 있으니 주의하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "범서기 보폭은 얼마나 돼?", "src": "Rules p.39", "exp": "Rules p.39: the front foot steps out one foot's length from the toes of the back foot.", "memo": ""}}, {"id": 13, "sec": "서기·준비서기 기준", "q": "범서기 앞발은 어떻게 딛어?", "src": "경기규칙 p.39", "exp": "앞발의 발목을 펴고 앞축만 가볍게 딛고 무릎을 약간 안으로 튼다.", "ans": "범서기의 앞발은 발목을 펴고 앞축만 가볍게 딛으며 무릎을 약간 안으로 틀어주어야 합니다. 체중은 뒷발에 90에서 100퍼센트 정도 실어주세요.", "pre": [null, null, null], "memo": "", "en": {"q": "범서기 앞발은 어떻게 딛어?", "src": "Rules p.39", "exp": "Rules p.39: ankle extended, only the ball of the foot lightly down, knee turned slightly inward.", "memo": ""}}, {"id": 14, "sec": "서기·준비서기 기준", "q": "오른서기 발 각도는 몇 도야?", "src": "경기규칙 p.39", "exp": "한발은 제자리, 반대 발은 틀어 앞축을 90°로 돌려 딛는다.", "ans": "질문하신 각도는 측정하지 않습니다. 2026 태권도 품새 경기규칙에 따르면 오른서기는 두 발의 각이 90도가 되어야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "오른서기 발 각도는 몇 도야?", "src": "Rules p.39", "exp": "Rules p.39: one foot stays; the other turns so the ball of the foot is rotated 90°.", "memo": ""}}, {"id": 15, "sec": "서기·준비서기 기준", "q": "오른서기 두 발 간격은?", "src": "경기규칙 p.39", "exp": "나란히서기와 같이 한 발 정도. 벌어지지 않으면 감점.", "ans": "오른서기 시 두 발의 간격은 한 발 정도 벌어지는 것이 기준입니다. 두 발의 간격이 한 발 정도 벌어지지 않았을 경우 감점 사항이 될 수 있습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "오른서기 두 발 간격은?", "src": "Rules p.39", "exp": "Rules p.39: about one foot's length, as in 나란히서기. Less than that is a deduction.", "memo": ""}}, {"id": 16, "sec": "서기·준비서기 기준", "q": "앞꼬아서기 앞발 각도는 몇 도야?", "src": "경기규칙 p.40", "exp": "앞발은 정면에서 45° 각을 이룬다.", "ans": "앞꼬아서기에서 앞발은 정면에서 45도 각도를 이루어야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞꼬아서기 앞발 각도는 몇 도야?", "src": "Rules p.40", "exp": "Rules p.40: the front foot is 45° from straight ahead.", "memo": ""}}, {"id": 17, "sec": "서기·준비서기 기준", "q": "앞꼬아서기 앞축은 어디에 딛어?", "src": "경기규칙 p.40", "exp": "지지되는 발의 발등을 넘어 새끼발가락 옆에 세운주먹 하나 정도.", "ans": "앞꼬아서기 동작 시 앞축은 지지되는 발의 발등을 넘어 새끼발가락 옆에 세운주먹 하나 정도의 간격으로 딛습니다. 이는 좌우로 이동할 때 사용되는 서기 동작의 기준입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞꼬아서기 앞축은 어디에 딛어?", "src": "Rules p.40", "exp": "Rules p.40: over the supporting foot's instep, about one upright fist beside the little toe.", "memo": ""}}, {"id": 18, "sec": "서기·준비서기 기준", "q": "뒤꼬아서기 두 발 간격은?", "src": "경기규칙 p.40", "exp": "지지 발 뒤꿈치와 딛는 발 앞축 사이가 주먹 하나 간격. 더 넓으면 감점.", "ans": "뒤꼬아서기에 대한 발 간격 정보는 제공된 자료에 포함되어 있지 않습니다. 국기원 공인 품새 규정에 따라 정확한 동작을 수행하시길 바랍니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 자료에 있는 간격을 없다고 답함. 기대 답변만 확인해 주세요.", "en": {"q": "뒤꼬아서기 두 발 간격은?", "src": "Rules p.40", "exp": "Rules p.40: one fist between the supporting heel and the ball of the stepping foot. Wider is a deduction.", "memo": "Known error: says the gap is not in the documents, though it is. Please check the expected answer only."}}, {"id": 19, "sec": "서기·준비서기 기준", "q": "기본준비서기 두 발 간격은?", "src": "경기규칙 p.37", "exp": "모아서기에서 왼발을 한 발 길이로 넓혀 선다.", "ans": "기본준비서기에서 두 발 간격은 모아서기에서 왼발을 한 발 길이만큼 넓혀서 나란히 서는 것이 기준입니다. 11월 3일 수련 당시 가가가님의 발 간격은 어깨너비의 0.8배로, 기준인 0.9배보다 7% 좁게 측정되었습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "기본준비서기 두 발 간격은?", "src": "Rules p.37", "exp": "Rules p.37: from 모아서기, the left foot moves out one foot's length.", "memo": ""}}, {"id": 20, "sec": "서기·준비서기 기준", "q": "기본준비서기 주먹과 주먹 사이 간격은?", "src": "경기규칙 p.37", "exp": "주먹과 주먹 사이는 한주먹.", "ans": "기본준비서기에서 주먹과 주먹 사이는 한 주먹 간격으로 띄우는 것이 기준입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "기본준비서기 주먹과 주먹 사이 간격은?", "src": "Rules p.37", "exp": "Rules p.37: one fist between the fists.", "memo": ""}}, {"id": 21, "sec": "서기·준비서기 기준", "q": "기본준비서기 몸통과 주먹 사이 간격은?", "src": "경기규칙 p.37", "exp": "몸통과 주먹 사이는 세운주먹 간격.", "ans": "기본준비서기에서 몸통과 주먹 사이는 세운 주먹 간격으로 띄우는 것이 기준입니다. 이는 국기원 경기 규칙에 따른 기준입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "기본준비서기 몸통과 주먹 사이 간격은?", "src": "Rules p.37", "exp": "Rules p.37: one upright fist between the trunk and the fists.", "memo": ""}}, {"id": 22, "sec": "서기·준비서기 기준", "q": "기본준비서기 두 주먹 높이는?", "src": "경기규칙 p.37", "exp": "아랫배(단전) 앞에 멈춘다. 명치보다 높게 끌어올리면 감점.", "ans": "11월 3일 태극 3장 수련 당시 기본 준비 자세에서 양손을 몸 앞 가운데로 약 7cm 올려 모아 보라는 피드백을 드렸습니다. 준비 손의 높이는 내 자세 어깨 아래 40cm, 기준 어깨 아래 35cm로 측정되어 약 7cm 올리라는 결과가 나왔습니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 규칙 대신 개인 수련 기록을 답함. 기대 답변만 확인해 주세요.", "en": {"q": "기본준비서기 두 주먹 높이는?", "src": "Rules p.37", "exp": "Rules p.37: they stop in front of the lower abdomen (단전). Raised above the solar plexus (명치) is a deduction.", "memo": "Known error: answers with the personal practice record instead of the rule. Please check the expected answer only."}}, {"id": 23, "sec": "서기·준비서기 기준", "q": "겹손준비서기 손은 어디까지 올려?", "src": "경기규칙 p.37", "exp": "단전에서 명치 앞까지 끌어올려 아랫배(단전) 앞에 멈춘다. 명치선 이상이면 감점.", "ans": "겹손준비서기는 단전에서 시작하여 명치 앞까지 끌어올린 뒤 서서히 아랫배 앞까지 내려 멈추는 동작입니다. 명치선 이상으로 올라가지 않도록 주의해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "겹손준비서기 손은 어디까지 올려?", "src": "Rules p.37", "exp": "Rules p.37: from the lower abdomen up to the solar plexus (명치), then they stop in front of the lower abdomen. Above the solar plexus line is a deduction.", "memo": ""}}, {"id": 24, "sec": "서기·준비서기 기준", "q": "겹손준비서기 손과 몸통 사이 간격은?", "src": "경기규칙 p.37", "exp": "오른손바닥과 몸통 사이는 세운 주먹 간격.", "ans": "겹손준비서기에서 오른손바닥과 몸통 사이는 세운 주먹 간격으로 띄워야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "겹손준비서기 손과 몸통 사이 간격은?", "src": "Rules p.37", "exp": "Rules p.37: one upright fist between the right palm and the trunk.", "memo": ""}}, {"id": 25, "sec": "서기·준비서기 기준", "q": "보주먹준비서기 손 높이는?", "src": "경기규칙 p.38", "exp": "가슴 앞으로 올려 인중선 앞에 멈춘다.", "ans": "보주먹준비서기에서 손은 단전 앞에서 모아 가슴 앞으로 올려 인중선 앞에 멈추어야 합니다. 인중 높이를 기준으로 삼아 동작을 수행하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "보주먹준비서기 손 높이는?", "src": "Rules p.38", "exp": "Rules p.38: raised past the chest to stop in front of the philtrum (인중) line.", "memo": ""}}, {"id": 26, "sec": "서기·준비서기 기준", "q": "보주먹준비서기 팔꿈치는 몇 도까지 펴도 돼?", "src": "경기규칙 p.38", "exp": "팔꿈치가 120° 이상 펴지면 감점.", "ans": "보주먹준비서기에서 팔꿈치는 120도 이상 펴지지 않도록 주의해야 합니다. 팔꿈치가 120도 이상 펴지면 감점 사항이 됩니다.", "pre": [null, null, null], "memo": "", "en": {"q": "보주먹준비서기 팔꿈치는 몇 도까지 펴도 돼?", "src": "Rules p.38", "exp": "Rules p.38: elbows opened 120° or more is a deduction.", "memo": ""}}, {"id": 27, "sec": "막기 기준", "q": "아래막기 주먹과 허벅지 간격은?", "src": "경기규칙 p.41", "exp": "막는 주먹은 앞발의 대퇴부에서 세운 주먹 두 개 정도 또는 한 뼘 정도 간격.", "ans": "아래막기를 할 때 막는 주먹은 앞발의 대퇴부에서 세운 주먹 두 개 정도 또는 한 뼘 정도 간격을 유지해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래막기 주먹과 허벅지 간격은?", "src": "Rules p.41", "exp": "Rules p.41: the blocking fist is about two upright fists, or one hand-span, from the front thigh.", "memo": ""}}, {"id": 28, "sec": "막기 기준", "q": "아래막기 시작할 때 막는 주먹 높이는?", "src": "경기규칙 p.41", "exp": "막는 주먹은 어깨높이 정도 올린다.", "ans": "아래막기를 할 때 막는 주먹은 어깨 높이 정도까지 올렸다가 시작합니다. 이는 막는 동작의 요령에 따른 기준입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래막기 시작할 때 막는 주먹 높이는?", "src": "Rules p.41", "exp": "Rules p.41: the blocking fist rises to about shoulder height.", "memo": ""}}, {"id": 29, "sec": "막기 기준", "q": "아래막기 반대 손은 어디에 둬?", "src": "경기규칙 p.41", "exp": "반대 팔목은 젖힌 주먹으로 장골능에 위치시킨다.", "ans": "아래막기를 할 때 반대 손은 엎은 주먹 상태로 자연스럽게 명치선에 위치시켜야 합니다. 또한 반대 팔목은 젖힌 주먹으로 장골능에 위치시키는 것이 올바른 방법입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래막기 반대 손은 어디에 둬?", "src": "Rules p.41", "exp": "Rules p.41: the other wrist is at the iliac crest (장골능), with the fist turned up.", "memo": ""}}, {"id": 30, "sec": "막기 기준", "q": "얼굴막기 이마에서 얼마나 떨어져?", "src": "경기규칙 p.42 / KTA 8급", "exp": "규칙 42쪽: 주먹 하나 정도 이마에서 떨어진다. KTA 8급: 세운주먹 하나 간격.", "ans": "얼굴막기를 할 때 막는 팔의 팔목은 이마에서 세운 주먹 하나 정도의 간격을 유지해야 합니다. 팔목이 이마에 너무 붙지 않도록 주의하며 중심선을 지켜 막아보세요.", "pre": [null, null, null], "memo": "", "en": {"q": "얼굴막기 이마에서 얼마나 떨어져?", "src": "Rules p.42 / KTA grade 8", "exp": "Rules p.42: about one fist from the forehead. KTA grade 8: one upright fist.", "memo": ""}}, {"id": 31, "sec": "막기 기준", "q": "얼굴막기 팔목 위치는?", "src": "경기규칙 p.42", "exp": "막는 팔의 팔목이 얼굴 중앙선에 위치한다.", "ans": "얼굴막기를 할 때 막는 팔의 팔목은 얼굴 중앙선에 위치해야 하며, 주먹 하나 정도가 이마에서 떨어지게 해야 합니다. 반대쪽 팔목은 옆구리인 장골능에 위치하도록 하십시오.", "pre": [null, null, null], "memo": "", "en": {"q": "얼굴막기 팔목 위치는?", "src": "Rules p.42", "exp": "Rules p.42: the blocking wrist is on the centre line of the face.", "memo": ""}}, {"id": 32, "sec": "막기 기준", "q": "바깥팔목 헤쳐막기 주먹 높이는 어디까지야?", "src": "경기규칙 p.43", "exp": "두 주먹이 어깨선 위로 올라가면 감점.", "ans": "아래 헤쳐막기는 양손을 교차하여 아래로 내려 단전을 지나 허벅지 양옆에 위치하며 마무리합니다. 주먹의 높이는 허벅지 옆에서 세운주먹 두 개 간격으로 위치하는 것이 기준입니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 다른 기술(아래 헤쳐막기)을 설명함. 기대 답변만 확인해 주세요.", "en": {"q": "바깥팔목 헤쳐막기 주먹 높이는 어디까지야?", "src": "Rules p.43", "exp": "Rules p.43: both fists above the shoulder line is a deduction.", "memo": "Known error: describes a different technique (아래 헤쳐막기). Please check the expected answer only."}}, {"id": 33, "sec": "막기 기준", "q": "아래 헤쳐막기 시작 높이는?", "src": "경기규칙 p.43", "exp": "두 팔목을 가슴 앞에서 엇걸어 교차하고 어깨선 높이에서 시작한다.", "ans": "아래 헤쳐막기는 두 팔목을 가슴 앞에서 엇걸어 교차하고 어깨 선 높이에서 시작합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래 헤쳐막기 시작 높이는?", "src": "Rules p.43", "exp": "Rules p.43: cross the wrists in front of the chest and start at shoulder-line height.", "memo": ""}}, {"id": 34, "sec": "막기 기준", "q": "아래 헤쳐막기 팔목과 허벅지 간격은?", "src": "경기규칙 p.43", "exp": "두 팔목이 허벅지 앞부분에 위치하고 한 뼘 간격.", "ans": "아래 헤쳐막기 시 두 팔목은 허벅지 앞부분에 위치하며 한 뼘 간격이 되도록 해야 합니다. 이는 태극 6장 및 기본동작 채점 기준에 따른 내용입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래 헤쳐막기 팔목과 허벅지 간격은?", "src": "Rules p.43", "exp": "Rules p.43: the wrists end in front of the thighs, one hand-span away.", "memo": ""}}, {"id": 35, "sec": "막기 기준", "q": "안팔목 헤쳐막기 주먹 높이는?", "src": "경기규칙 p.43", "exp": "두 주먹 끝이 어깨선을 넘지 않도록 한다.", "ans": "안팔목 헤쳐막기를 할 때 주먹의 높이는 어깨 위치에 두어야 합니다. 양 팔목은 양쪽 몸끝선까지 벌려서 동작을 수행해 보세요.", "pre": [null, null, null], "memo": "", "en": {"q": "안팔목 헤쳐막기 주먹 높이는?", "src": "Rules p.43", "exp": "Rules p.43: the tips of both fists must not pass the shoulder line.", "memo": ""}}, {"id": 36, "sec": "막기 기준", "q": "아래 손날 헤쳐막기 손날과 허벅지 간격은?", "src": "경기규칙 p.43", "exp": "두 손날이 허벅지 앞부분에 위치하고 한 뼘 간격.", "ans": "아래 손날 헤쳐막기를 할 때 두 손날과 허벅지 사이의 간격은 한 뼘이 되도록 해야 합니다. 이 동작은 두 손날로 단전 앞에서 바깥쪽으로 헤치며 허벅지 앞부분에 위치하도록 마무리합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래 손날 헤쳐막기 손날과 허벅지 간격은?", "src": "Rules p.43", "exp": "Rules p.43: the knife hands end in front of the thighs, one hand-span away.", "memo": ""}}, {"id": 37, "sec": "지르기·차기 높이", "q": "몸통지르기 주먹 높이는?", "src": "KTA 9급 신체 용어", "exp": "몸통은 명치.", "ans": "몸통지르기의 주먹 높이는 명치 끝을 기준으로 합니다. 주먹은 장골능에서 시작하여 목표점에 도달할 때 회전 동작이 완성되어야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "몸통지르기 주먹 높이는?", "src": "KTA grade 9 body terms", "exp": "KTA grade 9 body terms: 몸통 is the solar plexus (명치).", "memo": ""}}, {"id": 38, "sec": "지르기·차기 높이", "q": "얼굴지르기 주먹 높이는?", "src": "KTA 9급 신체 용어", "exp": "얼굴은 인중.", "ans": "얼굴지르기 시 두 주먹은 인중 앞에 위치하도록 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "얼굴지르기 주먹 높이는?", "src": "KTA grade 9 body terms", "exp": "KTA grade 9 body terms: 얼굴 is the philtrum (인중).", "memo": ""}}, {"id": 39, "sec": "지르기·차기 높이", "q": "아래 높이는 어디를 기준으로 해?", "src": "KTA 9급 신체 용어", "exp": "아래는 단전.", "ans": "11월 3일 태극 3장 수련에서 말씀드린 준비 손 높이는 어깨를 기준으로 측정하였습니다. 내 자세의 준비 손 높이는 왼손과 오른손 모두 어깨 아래 40cm 위치에 있었으며, 기준은 어깨 아래 35cm와 36cm입니다. 따라서 양손을 각각 약 7cm 정도 위로 올려서 기준 높이에 맞춰 보시기 바랍니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 규칙 대신 개인 수련 기록을 답함. 기대 답변만 확인해 주세요.", "en": {"q": "아래 높이는 어디를 기준으로 해?", "src": "KTA grade 9 body terms", "exp": "KTA grade 9 body terms: 아래 is the lower abdomen (단전).", "memo": "Known error: answers with the personal practice record instead of the rule. Please check the expected answer only."}}, {"id": 40, "sec": "지르기·차기 높이", "q": "편손끝 찌르기 높이는?", "src": "경기규칙 p.44", "exp": "편손끝은 명치 높이로 곧게 찌른다.", "ans": "편손끝 찌르기는 명치 높이로 곧게 찌르는 것이 기준입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "편손끝 찌르기 높이는?", "src": "Rules p.44", "exp": "Rules p.44: straight, at solar plexus (명치) height.", "memo": ""}}, {"id": 41, "sec": "지르기·차기 높이", "q": "앞차기 높이는 어디까지 차?", "src": "경기규칙 p.45", "exp": "품새에 특별한 규정이 없으면 차기의 목표는 얼굴 높이 이상.", "ans": "태권도 품새 경기규칙에 따라 모든 차기 기술의 목표는 얼굴 높이 이상으로 해야 합니다. 정확한 수행 과정 없이 높게만 차는 것은 감점 요인이 될 수 있으니 주의하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞차기 높이는 어디까지 차?", "src": "Rules p.45", "exp": "Rules p.45: unless a form says otherwise, the target of every kick is face height or higher.", "memo": ""}}, {"id": 42, "sec": "지르기·차기 높이", "q": "옆차기 할 때 상체 높이는?", "src": "경기규칙 p.45", "exp": "머리와 상체는 허리선 이상에 위치해야 한다.", "ans": "옆차기를 할 때 머리와 상체는 허리선 이상에 위치해야 합니다. 올바른 자세를 유지하여 정확하게 수행하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "옆차기 할 때 상체 높이는?", "src": "Rules p.45", "exp": "Rules p.45: the head and upper body must stay above the waist line.", "memo": ""}}, {"id": 43, "sec": "지르기·차기 높이", "q": "차기 할 때 양손 높이는?", "src": "경기규칙 p.45", "exp": "양손은 가슴에 붙이지 않고 자연스럽게 모은다(겨룸새). 가슴 아래에 붙이면 감점.", "ans": "차기 동작을 수행할 때 양손은 가슴에 붙이지 않고 자연스럽게 모은 겨룸새 형태를 유지해야 합니다. 차기 시 양손을 가슴 아래에 붙이는 것은 주요 감점 사항에 해당합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "차기 할 때 양손 높이는?", "src": "Rules p.45", "exp": "Rules p.45: the hands are gathered naturally, not against the chest (guard position). Held against the body below the chest is a deduction.", "memo": ""}}, {"id": 44, "sec": "품새별 높이·각도·시간", "q": "태극 3장 손날 안치기 높이는?", "src": "경기규칙 p.46", "exp": "손날의 높이는 목 높이.", "ans": "태극 3장의 손날 안치기 동작에서 손날의 높이는 목 높이로 합니다. 정확한 높이를 유지하며 동작을 수행해 보세요.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 3장 손날 안치기 높이는?", "src": "Rules p.46", "exp": "Rules p.46: neck height.", "memo": ""}}, {"id": 45, "sec": "품새별 높이·각도·시간", "q": "태극 3장 손날 바깥막기 손끝 높이는?", "src": "경기규칙 p.46 / KTA 6급", "exp": "규칙 46쪽: 막는 손끝의 높이는 어깨 높이. KTA 6급: 손날은 자신의 명치 높이, 팔꿈치는 90~120°. (두 자료의 표현이 달라 지도자 확인 필요)", "ans": "태극 3장의 손날 바깥막기에서 막는 손 끝의 높이는 어깨 정도로 합니다. 손목이 구부러지지 않도록 주의하며 동작을 수행해 보세요.", "pre": [null, null, null], "memo": "확인 질문 2 참고", "en": {"q": "태극 3장 손날 바깥막기 손끝 높이는?", "src": "Rules p.46 / KTA grade 6", "exp": "Rules p.46: the blocking fingertips are at shoulder height. KTA grade 6: the knife hand at your own solar plexus (명치) height, elbow bent 90~120°. (The two documents differ: an instructor should confirm.)", "memo": "See question 2 on the Questions for you tab."}}, {"id": 46, "sec": "품새별 높이·각도·시간", "q": "태극 4장 제비품 안치기 손날 높이는?", "src": "경기규칙 p.47", "exp": "손날안치기의 높이는 목 높이.", "ans": "태극 4장의 제비품 안치기에서 손날안치기의 높이는 목 높이로 합니다. 정확한 높이를 유지하며 동작을 수행해 보세요.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 4장 제비품 안치기 손날 높이는?", "src": "Rules p.47", "exp": "Rules p.47: neck height.", "memo": ""}}, {"id": 47, "sec": "품새별 높이·각도·시간", "q": "태극 4장 편손끝 세워 찌르기는 어디서 시작해?", "src": "경기규칙 p.47", "exp": "편손끝 세워 찌르기는 장골능에서 시작한다.", "ans": "태극 4장의 편손끝 세워 찌르기는 장골능에서 시작합니다. 이 동작은 손날 거들어 바깥 막기와 동시에 수행해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 4장 편손끝 세워 찌르기는 어디서 시작해?", "src": "Rules p.47", "exp": "Rules p.47: from the iliac crest (장골능).", "memo": ""}}, {"id": 48, "sec": "품새별 높이·각도·시간", "q": "태극 5장 메주먹 내려치기 높이는?", "src": "경기규칙 p.48 / KTA 4급", "exp": "규칙 48쪽: 팔과 어깨가 수평. 메주먹이 어깨선보다 높거나 낮으면 감점. KTA 4급: 어깨 높이로 마무리.", "ans": "태극 5장의 메주먹 내려치기 동작에서 메주먹은 어깨선과 수평이 되어야 합니다. 메주먹이 어깨선보다 높거나 낮으면 감점 사항이 될 수 있습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 5장 메주먹 내려치기 높이는?", "src": "Rules p.48 / KTA grade 4", "exp": "Rules p.48: arm and shoulder level. A hammer fist above or below the shoulder line is a deduction. KTA grade 4: it finishes at shoulder height.", "memo": ""}}, {"id": 49, "sec": "품새별 높이·각도·시간", "q": "태극 5장 팔굽돌려치기 높이는?", "src": "경기규칙 p.48", "exp": "팔꿈치는 턱 높이로 돌려 친다.", "ans": "태극 5장의 팔굽돌려치기는 턱 높이를 목표로 하여 수행합니다. 팔꿈치는 턱 높이로 돌려 치는 것이 기준입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 5장 팔굽돌려치기 높이는?", "src": "Rules p.48", "exp": "Rules p.48: the elbow strikes at chin height.", "memo": ""}}, {"id": 50, "sec": "품새별 높이·각도·시간", "q": "태극 5장 팔굽표적치기 표적 높이는?", "src": "경기규칙 p.48", "exp": "표적은 명치 높이.", "ans": "태극 5장의 팔굽표적치기에서 표적은 명치 높이로 합니다. 정확한 위치를 맞추어 강하게 치는 것이 중요합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 5장 팔굽표적치기 표적 높이는?", "src": "Rules p.48", "exp": "Rules p.48: solar plexus (명치) height.", "memo": ""}}, {"id": 51, "sec": "품새별 높이·각도·시간", "q": "태극 5장 짓찧는 발 각도는 몇 도야?", "src": "경기규칙 p.49", "exp": "짓찧는 발의 각도는 45°로 유지한다.", "ans": "태극 5장에서 짓찧는 발의 각도는 45도로 유지해야 합니다. 이는 동작 수행 시 짓찧는 소리가 나도록 하기 위함입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 5장 짓찧는 발 각도는 몇 도야?", "src": "Rules p.49", "exp": "Rules p.49: keep the stamping foot at 45°.", "memo": ""}}, {"id": 52, "sec": "품새별 높이·각도·시간", "q": "태극 5장 짓찧을 때 앞으로 얼마나 나가?", "src": "경기규칙 p.49", "exp": "차고 난 뒤 한걸음 반만큼 앞으로 나아가 짓찧는다.", "ans": "태극 5장의 등주먹앞치기 동작에서 짓찧는 발은 차고 난 뒤 한 걸음 반만큼 앞으로 나아가야 합니다. 이는 태극 5장 채점 기준에 명시된 내용입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 5장 짓찧을 때 앞으로 얼마나 나가?", "src": "Rules p.49", "exp": "Rules p.49: after the kick, one and a half steps forward, then stamp.", "memo": ""}}, {"id": 53, "sec": "품새별 높이·각도·시간", "q": "태극 6장 손날 얼굴 비틀어 막기 높이는?", "src": "경기규칙 p.50 / KTA 3급", "exp": "규칙 50쪽: 손날이 얼굴 높이. KTA 3급: 손날은 인중 높이.", "ans": "태극 6장의 손날 얼굴 비틀어 막기는 팔을 교차하여 손날이 얼굴 높이가 되어야 하며 어깨선은 45도 정도가 되어야 합니다. 동작 수행 시 손날의 방향과 손목 비틀림을 분명히 하여 얼굴 바깥쪽으로 받아내는 느낌으로 막아주세요.", "pre": [null, null, null], "memo": "확인 질문 2 참고", "en": {"q": "태극 6장 손날 얼굴 비틀어 막기 높이는?", "src": "Rules p.50 / KTA grade 3", "exp": "Rules p.50: the knife hand at face height. KTA grade 3: at philtrum (인중) height.", "memo": "See question 2 on the Questions for you tab."}}, {"id": 54, "sec": "품새별 높이·각도·시간", "q": "태극 6장 비틀어 막기 어깨선 각도는?", "src": "경기규칙 p.50", "exp": "어깨선이 45° 정도.", "ans": "태극 6장의 손날 비틀어 막기 동작 시 어깨선은 45도 정도가 되어야 합니다. 정확한 각도를 유지하며 동작을 수행해 보세요.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 6장 비틀어 막기 어깨선 각도는?", "src": "Rules p.50", "exp": "Rules p.50: the shoulder line at about 45°.", "memo": ""}}, {"id": 55, "sec": "품새별 높이·각도·시간", "q": "태극 6장 얼굴 바깥막기 높이는?", "src": "경기규칙 p.50 / KTA 3급", "exp": "규칙 50쪽: 몸끝선 정도로 맞춘다. KTA 3급: 바깥팔목은 인중 높이, 주먹의 높이는 머리끝선까지 허용.", "ans": "태극 6장의 얼굴 바깥막기는 얼굴 높이에서 공격을 바깥쪽으로 막는 동작입니다. 동작의 시작점은 몸통 부위 안에서 이루어져야 하며, 중간 과정에서 주먹이나 손끝이 인중선 높이 정도로 약간의 곡선을 그리며 지나가야 합니다.", "pre": [null, null, null], "memo": "확인 질문 2 참고", "en": {"q": "태극 6장 얼굴 바깥막기 높이는?", "src": "Rules p.50 / KTA grade 3", "exp": "Rules p.50: level with the body's outer line (몸끝선). KTA grade 3: the outer wrist at philtrum (인중) height; the fist may reach the top of the head.", "memo": "See question 2 on the Questions for you tab."}}, {"id": 56, "sec": "품새별 높이·각도·시간", "q": "태극 6장 바탕손 안막기 팔 각도는?", "src": "경기규칙 p.50", "exp": "팔의 각도는 90~120°. 120° 이상 펴서 막으면 감점.", "ans": "태극 6장 바탕손 안막기 시 팔의 각도는 90도에서 120도로 합니다. 손목은 젖혀서 바탕손으로 막고 명치 높이에 위치해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 6장 바탕손 안막기 팔 각도는?", "src": "Rules p.50", "exp": "Rules p.50: 90~120°. Opening past 120° is a deduction.", "memo": ""}}, {"id": 57, "sec": "품새별 높이·각도·시간", "q": "태극 6장 바탕손 안막기 높이는?", "src": "경기규칙 p.50", "exp": "명치 높이에 위치한다.", "ans": "태극 6장의 바탕손 안막기는 명치 높이에 위치해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 6장 바탕손 안막기 높이는?", "src": "Rules p.50", "exp": "Rules p.50: at solar plexus (명치) height.", "memo": ""}}, {"id": 58, "sec": "품새별 높이·각도·시간", "q": "태극 7장 바탕손 거들어 안막기 높이는?", "src": "경기규칙 p.51", "exp": "명치 높이.", "ans": "태극 7장의 10번째 동작인 바탕손 거들어 안막기에서 손의 높이에 대한 구체적인 수치는 정해져 있지 않습니다. 다만 막는 손과 보조손의 간격이 너무 멀거나 붙지 않도록 주의하며 정확한 범서기를 유지하는 것이 중요합니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 규칙에 있는 높이를 정해져 있지 않다고 답함. 기대 답변만 확인해 주세요.", "en": {"q": "태극 7장 바탕손 거들어 안막기 높이는?", "src": "Rules p.51", "exp": "Rules p.51: solar plexus (명치) height.", "memo": "Known error: says no height is set, though the rules give one. Please check the expected answer only."}}, {"id": 59, "sec": "품새별 높이·각도·시간", "q": "태극 7장 등주먹 앞치기 높이는?", "src": "경기규칙 p.51", "exp": "인중 높이.", "ans": "태극 7장의 등주먹 앞치기는 인중 높이로 수행해야 합니다. 동작 시 허리 회전을 사용하여 힘을 전달하는 것이 중요합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 등주먹 앞치기 높이는?", "src": "Rules p.51", "exp": "Rules p.51: philtrum (인중) height.", "memo": ""}}, {"id": 60, "sec": "품새별 높이·각도·시간", "q": "태극 7장 등주먹 바깥치기 높이는?", "src": "경기규칙 p.52", "exp": "높이는 인중선.", "ans": "태극 7장의 등주먹 바깥치기 높이는 인중선으로 합니다. 동작 수행 시 이 높이를 유지하도록 주의해 주세요.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 등주먹 바깥치기 높이는?", "src": "Rules p.52", "exp": "Rules p.52: the philtrum (인중) line.", "memo": ""}}, {"id": 61, "sec": "품새별 높이·각도·시간", "q": "태극 7장 표적차기 높이는?", "src": "경기규칙 p.52 / KTA 2급", "exp": "규칙 52쪽: 얼굴 높이로 찬다. KTA 2급: 표적은 어깨높이. (두 자료의 표현이 달라 지도자 확인 필요)", "ans": "태극 7장의 표적차기는 얼굴 높이로 차야 합니다. 정확한 높이를 유지하며 발날등을 사용하여 차는 것이 중요합니다.", "pre": [null, null, null], "memo": "확인 질문 2 참고", "en": {"q": "태극 7장 표적차기 높이는?", "src": "Rules p.52 / KTA grade 2", "exp": "Rules p.52: face height. KTA grade 2: the target at shoulder height. (The two documents differ: an instructor should confirm.)", "memo": "See question 2 on the Questions for you tab."}}, {"id": 62, "sec": "품새별 높이·각도·시간", "q": "태극 7장 주춤서기 팔굽 표적치기 높이는?", "src": "경기규칙 p.52", "exp": "명치 높이.", "ans": "태극 7장의 주춤서기 팔굽 표적치기는 명치 높이로 수행해야 합니다. 정확한 동작을 위해 명치 위치를 확인하며 연습해 보시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 주춤서기 팔굽 표적치기 높이는?", "src": "Rules p.52", "exp": "Rules p.52: solar plexus (명치) height.", "memo": ""}}, {"id": 63, "sec": "품새별 높이·각도·시간", "q": "태극 7장 두 주먹 젖혀지르기 높이는?", "src": "KTA 2급", "exp": "주먹의 높이는 늑골 아래.", "ans": "젖혀 지르기의 지른 주먹이 늑골 위로 지나치게 올라가거나 내려가지 않도록 주의해야 합니다. 이는 태극 7장 채점 기준에 따른 주요 감점 사항입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 두 주먹 젖혀지르기 높이는?", "src": "KTA grade 2", "exp": "KTA grade 2: the fists are below the ribs.", "memo": ""}}, {"id": 64, "sec": "품새별 높이·각도·시간", "q": "태극 8장 두발당성 앞차기 높이는?", "src": "경기규칙 p.53", "exp": "첫 번째 발은 몸통 높이 이상, 다음 발은 얼굴 높이로 찬다.", "ans": "태극 8장의 두발당성 앞차기는 첫 번째 발을 몸통 높이 이상으로 차고, 이어서 다음 발은 얼굴 높이로 차야 합니다. 첫 번째 발이 지면에 닿기 전에 이어 차는 것이 중요합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 8장 두발당성 앞차기 높이는?", "src": "Rules p.53", "exp": "Rules p.53: the first foot at trunk height or higher, the next foot at face height.", "memo": ""}}, {"id": 65, "sec": "품새별 높이·각도·시간", "q": "태극 8장 당겨 턱 지르기 당긴 손 높이는?", "src": "경기규칙 p.53", "exp": "당긴 손은 어깨선에 위치한다.", "ans": "태극 8장의 당겨 턱 지르기에서 당긴 손은 어깨선에 위치해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 8장 당겨 턱 지르기 당긴 손 높이는?", "src": "Rules p.53", "exp": "Rules p.53: the pulled hand is at the shoulder line.", "memo": ""}}, {"id": 66, "sec": "품새별 높이·각도·시간", "q": "태극 8장 당겨 턱 지르기는 몇 초 동안 해?", "src": "경기규칙 p.53", "exp": "8초 정도. 마지막에 급하게 지르지 않는다.", "ans": "태극 8장의 당겨 턱 지르기 동작은 8초 정도의 시간을 들여 힘을 주어 서서히 지르는 것이 기준입니다. 마지막에 급하게 지르지 않도록 주의하며 동작을 수행하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 8장 당겨 턱 지르기는 몇 초 동안 해?", "src": "Rules p.53", "exp": "Rules p.53: about 8 seconds, with no rush at the end.", "memo": ""}}, {"id": 67, "sec": "문서에 수치가 없는 항목", "q": "앞굽이 앞무릎 각도는 몇 도야?", "src": "경기규칙 p.39", "exp": "자료에 각도 수치가 없음. 수치를 지어내지 않고, 규칙 39쪽의 '앞 무릎과 발끝이 일치되도록'을 말함.", "ans": "앞굽이 동작에서 앞무릎 각도에 대한 별도의 수치는 규정되어 있지 않습니다. 다만 앞굽이 시 몸을 반듯하게 세우고 땅을 내려다봤을 때 앞에 있는 무릎과 발끝이 일치되도록 무릎과 몸을 낮추어야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞굽이 앞무릎 각도는 몇 도야?", "src": "Rules p.39", "exp": "The documents give no angle. Invents no number, and gives Rules p.39: the front knee lines up with the toes.", "memo": ""}}, {"id": 68, "sec": "문서에 수치가 없는 항목", "q": "주춤서기 무릎 각도는 몇 도야?", "src": "경기규칙 p.38", "exp": "자료에 각도 수치가 없음. 수치를 지어내지 않고, 규칙 38쪽의 '무릎과 발끝이 일치되도록'을 말함.", "ans": "주춤서기 무릎 각도에 대해서는 별도로 측정하지 않습니다. 다만 주춤서기를 할 때 서서 아래를 내려다보았을 때 무릎과 발끝이 일치되도록 자세를 취해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "주춤서기 무릎 각도는 몇 도야?", "src": "Rules p.38", "exp": "The documents give no angle. Invents no number, and gives Rules p.38: the knees line up with the toes.", "memo": ""}}, {"id": 69, "sec": "문서에 수치가 없는 항목", "q": "몸통지르기 팔꿈치 각도는 몇 도야?", "src": "경기규칙 p.44", "exp": "자료에 각도 수치가 없음. 수치를 지어내지 않고, 규칙 44쪽의 '팔꿈치가 몸의 바깥 부분을 스치며'를 말함.", "ans": "팔꿈치 각도는 측정하지 않습니다. 몸통지르기를 할 때 팔꿈치는 몸의 바깥 부분을 스치며 나가고 들어와야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "몸통지르기 팔꿈치 각도는 몇 도야?", "src": "Rules p.44", "exp": "The documents give no angle. Invents no number, and gives Rules p.44: the elbow brushes past the outer side of the body.", "memo": ""}}, {"id": 70, "sec": "기본동작", "q": "통밀기준비서기 어떻게 해?", "src": "경기규칙 p.38", "exp": "두 발 나란히서기로 선다. 두 손을 손날과 같이하여 단전 앞에서부터 모아 가며 손바닥이 위를 향하게 하면서 가슴 앞까지 끌어올렸다가, 두 손을 손바닥이 마주 보게 하면서 손날을 세워 서서히 앞으로 민다. 앞으로 밀 때 손의 모양은 얼굴을 마주 잡은 것처럼 한다. 손끝이 위를 향하도록 팔꿈치는 120°가량 펴면서 내민다. 두 손끝의 높이는 인중에 위치한다.", "ans": "통밀기준비서기는 품새를 시작하기 위한 준비 자세로 두 발을 나란히 서기로 선 뒤 수행합니다. 먼저 두 손을 단전 앞에서부터 모아 가슴 앞까지 끌어올렸다가 손바닥이 마주 보게 한 뒤 손날을 세워 서서히 앞으로 밉니다. 이때 두 손날의 너비는 얼굴 너비 정도로 유지하며 손끝은 인중 높이에 위치하도록 합니다. 팔꿈치는 120도 정도 펴면서 손끝이 위를 향하게 하여 얼굴을 마주 잡은 것처럼 모양을 만듭니다. 두 손끝이 인중보다 너무 높거나 낮으면 감점될 수 있으니 주의해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "통밀기준비서기 어떻게 해?", "src": "Rules p.38", "exp": "Rules p.38: Stand with the feet parallel (나란히서기). With the hands like knife hands, gather them from in front of the lower abdomen (단전), palms up, and raise them to the chest; then turn the palms to face each other, raise the knife hands and slowly push forward. While pushing, shape the hands as if holding a face. Fingertips up, elbows opened to about 120°. The fingertips are at the philtrum (인중).", "memo": ""}}, {"id": 71, "sec": "기본동작", "q": "주춤서기 기준점 알려줘", "src": "경기규칙 p.38", "exp": "발과 발의 간격은 두발 길이 정도로 선다. 발의 안쪽(발날등)이 서로 나란히 되게 한다. 몸통은 반듯하게 하고 두 무릎을 굽히는데, 서서 아래를 내려다봤을 때 무릎과 발끝이 일치되도록 한다.", "ans": "주춤서기는 발과 발의 간격을 두 발 길이 정도로 벌리고 발의 안쪽인 발날등이 서로 나란하게 서는 것이 기준입니다. 몸통을 반듯하게 세운 상태에서 두 무릎을 굽히는데 이때 위에서 내려다보았을 때 무릎과 발끝이 일치해야 합니다. 만약 무릎이나 발끝이 안쪽이나 바깥쪽으로 열리거나 닫히면 감점 요인이 됩니다. 또한 엉덩이가 뒤로 빠지거나 상체가 앞으로 쏠리지 않도록 주의하며 바른 자세를 유지해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "주춤서기 기준점 알려줘", "src": "Rules p.38", "exp": "Rules p.38: About two foot-lengths between the feet, with the inner edges (발날등) parallel. Trunk upright, both knees bent so that, looking down, the knees line up with the toes.", "memo": ""}}, {"id": 72, "sec": "기본동작", "q": "주춤서기에서 감점되는 경우", "src": "경기규칙 p.38", "exp": "규칙 38쪽 주요 감점사항: 무릎이나 발끝이 열리거나 닫힐 경우. 엉덩이가 뒤로 빠질 경우. 상체가 앞으로 쏠릴 경우.", "ans": "주춤서기에서 감점되는 경우는 무릎이나 발끝이 열리거나 닫히는 경우와 엉덩이가 뒤로 빠지는 경우입니다. 또한 상체가 앞으로 쏠릴 경우에도 감점 대상이 됩니다. 주춤서기를 할 때는 발과 발의 간격을 두 발 길이 정도로 유지하고 발 안쪽이 서로 나란히 되도록 서야 합니다. 몸통을 반듯하게 세우고 아래를 내려다보았을 때 무릎과 발끝이 일치하도록 자세를 잡아야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "주춤서기에서 감점되는 경우", "src": "Rules p.38", "exp": "Rules p.38, deductions: knees or toes opening or closing; hips pushed back; upper body leaning forward.", "memo": ""}}, {"id": 73, "sec": "기본동작", "q": "앞서기 감점 사항은?", "src": "경기규칙 p.38", "exp": "규칙 38쪽 주요 감점사항: 보폭이 너무 넓거나 너무 좁을 경우. 몸의 중심축이 무너졌을 경우. 뒷발의 내각이 30° 이상 벌어질 경우.", "ans": "앞서기 동작에서 감점이 되는 주요 사항은 보폭이 너무 넓거나 좁은 경우입니다. 또한 몸의 중심축이 무너졌을 때도 감점 대상이 됩니다. 마지막으로 뒷발의 내각이 30도 이상으로 과도하게 벌어질 경우에도 감점 처리가 됩니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞서기 감점 사항은?", "src": "Rules p.38", "exp": "Rules p.38, deductions: stance too wide or too narrow; the body's centre axis collapsing; the back foot's inner angle wider than 30°.", "memo": ""}}, {"id": 74, "sec": "기본동작", "q": "앞굽이 어떻게 해?", "src": "경기규칙 p.39", "exp": "두 발의 길이는 한걸음 반 정도로 한다. 몸을 반듯하게 서서 땅을 내려다봤을 때 앞에 있는 무릎과 발끝이 일치되도록 무릎과 몸을 낮춘다. 뒷발의 내각은 30° 정도, 뒷다리의 무릎을 펴고 체중의 2/3를 앞에 둔다. 몸을 반듯하게 세우고 몸통은 30° 정도로 틀어준다.", "ans": "앞굽이는 두 발의 길이를 한 걸음 반 정도로 벌리고 서는 동작입니다. 몸을 반듯하게 세운 상태에서 앞 무릎을 굽혀 내려다보았을 때 무릎과 발끝이 일치하도록 자세를 낮추어야 합니다. 뒷발의 내각은 30도 정도로 유지하며 뒷다리의 무릎을 곧게 펴고 체중의 3분의 2를 앞에 두어야 합니다. 이때 몸통은 30도 정도로 틀어주며 중심축이 무너지지 않도록 주의해야 합니다. 보폭이 너무 넓어 균형을 잃거나 뒷발의 뒤축이 들리고 무릎이 굽어지면 감점될 수 있습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞굽이 어떻게 해?", "src": "Rules p.39", "exp": "Rules p.39: About one and a half steps between the feet. Body upright and lowered until, looking down, the front knee lines up with the toes. Inner angle of the back foot about 30°, back knee straight, two thirds (2/3) of the weight forward. Trunk turned about 30°.", "memo": ""}}, {"id": 75, "sec": "기본동작", "q": "앞굽이 할 때 자주 틀리는 점", "src": "경기규칙 p.39", "exp": "규칙 39쪽 주요 감점사항: 보폭이 넓어 허리와 골반부가 서기와 균형을 이루지 못할 경우. 뒤에 있는 발의 뒤축이 들려지거나 무릎이 굽어질 경우. 뒷발의 각이 30° 이상 벌어질 경우. 몸의 중심축이 무너졌을 경우. 뒤축이 먼저 닿거나 쿵쿵 소리를 낼 경우.", "ans": "앞굽이 시 보폭이 너무 넓어 허리와 골반의 균형이 무너지거나, 뒷발의 뒤축이 들리고 무릎이 굽어지는 경우가 많습니다. 또한 뒷발의 각도가 30도 이상 벌어지거나 몸의 중심축이 무너지는 것도 주요 감점 사항이니 주의해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞굽이 할 때 자주 틀리는 점", "src": "Rules p.39", "exp": "Rules p.39, deductions: a stance so wide that the waist and pelvis lose balance; the back heel lifting or the back knee bending; the back foot wider than 30°; the centre axis collapsing; the heel landing first or a thudding sound.", "memo": ""}}, {"id": 76, "sec": "기본동작", "q": "뒷굽이 기준점 알려줘", "src": "경기규칙 p.39", "exp": "(오른 뒷굽이) 오른발을 90° 벌려 선 상태에서 왼발 한걸음 길이로 내디디며 몸을 반듯하게 세우고 두 무릎을 굽혀 몸을 낮춘다. 몸을 낮출 때 무릎은 오른발 끝 지면과 60~70°되게 굽히고 왼발 무릎은 정면(왼발 끝 방향)으로 지면에서 100~110°가량 약간 구부린다. 두 무릎은 90°가 되게 한다. 주춤서기 때와 같이 무릎을 안으로 조이면 안 된다.", "ans": "오른뒷굽이는 오른발을 90도 벌려 선 상태에서 왼발을 한 걸음 길이로 내디디며 몸을 반듯하게 세우고 두 무릎을 굽혀 몸을 낮추는 동작입니다. 몸을 낮출 때 오른발 무릎은 지면과 60에서 70도 정도가 되게 굽히고 왼발 무릎은 정면 방향으로 지면에서 100에서 110도 정도 약간 구부려 두 무릎의 각도가 90도가 되도록 유지해야 합니다. 이때 주춤서기처럼 무릎을 안으로 조이지 않도록 주의해야 하며 몸의 중심축이 무너지거나 앞발 뒤꿈치가 들리지 않게 해야 합니다. 또한 엉덩이가 뒤로 빠져 범서기 형태가 되지 않도록 하고 오른 어깨의 각도가 뒤로 너무 돌아가지 않게 신경 써야 합니다.", "pre": [null, null, null], "memo": "확인 질문 3 참고", "en": {"q": "뒷굽이 기준점 알려줘", "src": "Rules p.39", "exp": "Rules p.39: (오른 뒷굽이) With the right foot opened 90°, the left foot steps out one step's length; body upright, both knees bent to lower the body. The right knee bends to 60~70° with the ground at the toes; the left knee bends slightly, about 100~110° from the ground, facing forward. 90° between the knees. The knees must not squeeze inward as in 주춤서기.", "memo": "See question 3 on the Questions for you tab."}}, {"id": 77, "sec": "기본동작", "q": "뒷굽이에서 감점되는 경우", "src": "경기규칙 p.39", "exp": "규칙 39쪽 주요 감점사항: 무릎이 열릴 경우. 몸의 중심축이 무너졌을 경우. 앞발 뒤꿈치가 들릴 경우. 엉덩이가 뒤로 빠지면서 범서기 같은 형태가 될 경우. 오른 어깨의 각(45°)이 뒤로 너무 돌아갔을 경우.", "ans": "뒷굽이 동작에서 감점되는 주요 사항은 무릎이 열리거나 몸의 중심축이 무너지는 경우입니다. 또한 앞발 뒤꿈치가 들리거나 엉덩이가 뒤로 빠지면서 범서기 같은 형태가 될 때도 감점 대상이 됩니다. 오른 어깨의 각도가 45도보다 뒤로 너무 돌아가는 경우에도 정확도에서 감점이 발생합니다. 이러한 기준들은 동작의 안정성과 균형을 유지하기 위해 반드시 지켜야 하는 규정입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "뒷굽이에서 감점되는 경우", "src": "Rules p.39", "exp": "Rules p.39, deductions: knees opening; the centre axis collapsing; the front heel lifting; hips pushed back into something like 범서기; the shoulder (45°) turned too far back.", "memo": ""}}, {"id": 78, "sec": "기본동작", "q": "범서기 감점 사항은?", "src": "경기규칙 p.39", "exp": "규칙 39쪽 주요 감점사항: 무릎이 지나치게 열릴 경우. 보폭이 너무 짧거나 길 경우. 상체가 뒤로 젖혀지거나 엉덩이가 뒤로 빠질 경우.", "ans": "범서기 동작에서 주요 감점 사항은 무릎이 지나치게 열리거나 보폭이 너무 짧거나 긴 경우입니다. 또한 상체가 뒤로 젖혀지거나 엉덩이가 뒤로 빠지는 자세가 나올 때도 감점 대상이 됩니다. 이러한 기준은 범서기 수행 시 체중을 뒷발에 90에서 100퍼센트 실어야 하는 원칙을 지키기 위함입니다. 올바른 범서기를 위해서는 뒷발을 내려다보았을 때 무릎과 발끝이 일직선이 되도록 유지하는 것이 중요합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "범서기 감점 사항은?", "src": "Rules p.39", "exp": "Rules p.39, deductions: knee opening too far; stance too short or too long; upper body leaning back or hips pushed back.", "memo": ""}}, {"id": 79, "sec": "기본동작", "q": "학다리서기에서 감점되는 경우", "src": "경기규칙 p.40", "exp": "규칙 40쪽 주요 감점사항: 서기에서 무릎이 펴지는 경우. 든 발의 내측을 지지축 무릎 내측에 붙이지 않는 경우. 무릎이 벌어지는 경우. 무릎 위에 걸치는 경우.", "ans": "학다리서기에서 감점되는 경우는 서기 동작 중 무릎이 펴지거나, 든 발의 내측을 지지축 무릎 내측에 제대로 붙이지 않는 경우입니다. 또한 무릎이 벌어지거나 무릎 위에 발을 걸치는 경우에도 감점 대상이 됩니다. 학다리서기 시 지지하고 있는 발 이외에 신체 일부가 바닥에 닿을 때마다 0.3점이 감점됩니다. 디딤발이 한 발 이상 옮겨지지 않으면 0.1점이 감점되며, 디딤발을 뛰어 딛거나 상체가 과도하게 흔들리는 경우에도 0.3점이 감점될 수 있습니다.", "pre": [null, null, null], "memo": "확인 질문 8 참고", "en": {"q": "학다리서기에서 감점되는 경우", "src": "Rules p.40", "exp": "Rules p.40, deductions: the standing knee straightening; the raised foot's inner side not against the supporting knee's inner side; the knee opening; the foot resting on top of the knee.", "memo": "See question 8 on the Questions for you tab."}}, {"id": 80, "sec": "기본동작", "q": "뒤꼬아서기 어떻게 해?", "src": "경기규칙 p.40", "exp": "앞뒤로 이동 시 사용되는 서기 동작. 지지가 되는 발의 뒤꿈치의 대각선상에 앞축을 딛는다. 앞발은 정면에서 45° 각을 이루며, 뒷발의 정강이가 앞발의 장딴지에 붙인다.", "ans": "뒤꼬아서기는 좌우로 이동할 때 사용하는 서기 동작으로, 지지하는 발의 발등을 넘어 새끼발가락 옆에 앞축을 딛는 것이 핵심입니다. 이때 앞발은 정면에서 45도 각도를 이루어야 하며, 뒷발의 정강이가 앞발의 장딴지에 밀착되도록 해야 합니다. 만약 옮기는 발이 지지하는 발 앞으로 교차하지 않으면 감점 요인이 되니 주의해야 합니다. 태극 7장의 21번째 동작인 왼 뒤 꼬아서기 두 주먹 젖혀지르기를 할 때는 착지 시 무릎을 살짝 굽혀 중심을 낮추고 어깨가 올라가지 않도록 유의하며 강하게 지르세요.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 앞꼬아서기 내용을 뒤꼬아서기로 답함. 기대 답변만 확인해 주세요.", "en": {"q": "뒤꼬아서기 어떻게 해?", "src": "Rules p.40", "exp": "Rules p.40: A stance for moving forward and back. The ball of the foot lands on the diagonal from the supporting heel. The front foot is 45° from straight ahead, with the back shin against the front calf.", "memo": "Known error: describes 앞꼬아서기 as 뒤꼬아서기. Please check the expected answer only."}}, {"id": 81, "sec": "기본동작", "q": "모아서기 기준점 알려줘", "src": "경기규칙 p.40", "exp": "두 발날등을 모아 맞대고 두 무릎을 곧게 편 서기 동작.", "ans": "모아서기는 두 발날등을 모아 맞대고 두 무릎을 곧게 펴서 서는 동작입니다. 이 동작을 수행할 때 두 발이 벌어지면 감점 요인이 되므로 주의해야 합니다. 정확한 자세를 유지하여 안정감 있게 서는 것이 중요합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "모아서기 기준점 알려줘", "src": "Rules p.40", "exp": "Rules p.40: Inner edges of both feet (발날등) together, both knees straight.", "memo": ""}}, {"id": 82, "sec": "기본동작", "q": "아래막기 감점 사항은?", "src": "경기규칙 p.41", "exp": "규칙 41쪽 주요 감점사항: 몸통을 함께 사용하지 않고, 몸통을 과장되게 틀어서 막는 경우. 막는 팔이 대퇴선상에 오지 않거나 벗어나는 경우. 막는 팔의 팔꿈치가 들리거나 밖으로 나가는 경우. 막는 팔이 지르기 형태로 가는 경우. 허리에 위치하는 반대 손 손목의 위치가 장골능 위 허리선에 위치하지 않고 뒤로 들어가거나 앞으로 나오는 경우.", "ans": "아래막기에서 몸통을 함께 사용하지 않거나 몸통을 과장되게 틀어서 막는 경우 감점됩니다. 막는 팔이 대퇴선상에 오지 않거나 벗어나는 경우와 팔꿈치가 들리거나 밖으로 나가는 경우에도 감점 사항에 해당합니다. 또한 막는 팔이 지르기 형태로 나가는 경우와 허리에 위치하는 반대 손 손목이 장골능 위 허리선 위치를 벗어나 뒤로 들어가거나 앞으로 나오는 경우에도 감점이 발생합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래막기 감점 사항은?", "src": "Rules p.41", "exp": "Rules p.41, deductions: not using the trunk, or twisting it too much; the blocking arm off the thigh line; the blocking elbow lifting or going outward; the blocking arm moving like a punch; the other wrist not on the waist line above the iliac crest (too far back or forward).", "memo": ""}}, {"id": 83, "sec": "기본동작", "q": "몸통 바깥막기 어떻게 해?", "src": "경기규칙 p.41", "exp": "막는 팔의 주먹등이 몸으로 향하게 하고 주먹 끝이 어깨선과 일치하게 한다. 반대 팔목은 젖힌 주먹으로 장골능에 위치시킨다. (요령) 막는 팔의 주먹은 젖힌 주먹으로 반대 팔의 팔꿈치보다 약간 아래(주먹 하나 정도)에 두고, 반대 팔은 막는 팔 안쪽에서 주먹등 부분이 위쪽을 향하게 하여 막는 팔의 어깨에서 약간 떨어진 상태로 시작한다. 시작점 높이는 몸통 부위 안에서 이루어져야 한다. 중간 과정은 주먹이나 손끝이 위를 향해 인중선 높이 정도로 약간의 곡선을 이루듯 지나간다.", "ans": "몸통 바깥막기는 막는 팔의 주먹등이 몸을 향하게 하고 주먹 끝을 어깨선과 일치시켜 수행하는 기술입니다. 막는 팔의 주먹은 반대 팔의 팔꿈치보다 주먹 하나 정도 아래에 두고, 반대 팔은 막는 팔 안쪽에서 주먹등이 위를 향하게 하여 어깨에서 약간 떨어진 상태로 시작합니다. 이때 막는 팔의 시작점 높이는 몸통 부위 안에서 이루어져야 하며, 중간 과정에서 주먹이나 손끝이 인중선 높이 정도로 약간의 곡선을 그리며 지나가야 합니다. 만약 막는 팔의 팔꿈치가 대퇴선상에 위치하지 않거나 팔꿈치가 들리면 감점될 수 있으니 주의해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "몸통 바깥막기 어떻게 해?", "src": "Rules p.41", "exp": "Rules p.41: The back of the blocking fist faces the body, with the tip of the fist on the shoulder line. The other wrist is at the iliac crest (장골능), with the fist turned up. To start: the blocking fist, turned up, is a little below the other elbow (about one fist), and the other arm is inside it, slightly away from the shoulder. The start stays within the trunk. Midway, the fist or fingertips pass upward at about philtrum (인중) height in a slight curve.", "memo": ""}}, {"id": 84, "sec": "기본동작", "q": "몸통 바깥막기 할 때 자주 틀리는 점", "src": "경기규칙 p.41", "exp": "규칙 41쪽 주요 감점사항: 막는 팔의 팔꿈치가 대퇴선상에 위치하지 않을 경우. 막는 팔꿈치가 들릴 경우. 막는 팔이 안에서 나갈 경우. 막는 팔의 시작점 높이가 몸통 부위가 아닌 장골능에서 시작할 경우.", "ans": "몸통 바깥막기 시 막는 팔의 팔꿈치가 대퇴선상에 위치하지 않거나 팔꿈치가 들리는 경우, 그리고 막는 팔이 안에서 나가는 경우에 주로 감점이 발생합니다. 또한 막는 팔의 시작점 높이가 몸통 부위가 아닌 장골능에서 시작하는 것도 주요 감점 사항입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "몸통 바깥막기 할 때 자주 틀리는 점", "src": "Rules p.41", "exp": "Rules p.41, deductions: the blocking elbow off the thigh line; the blocking elbow lifting; the blocking arm going out from inside; the start at the iliac crest (장골능) instead of the trunk.", "memo": ""}}, {"id": 85, "sec": "기본동작", "q": "몸통막기 기준점 알려줘", "src": "경기규칙 p.42", "exp": "모든 몸통 안막기는 팔목이 몸의 중심선에 와야 한다. 팔의 내각은 90~120°로 한다. 막는 주먹의 높이는 어깨높이 정도로 한다. 반대 팔목은 젖힌 주먹으로 장골능에 위치한다. 몸통과 함께 팔꿈치가 진행해야 하며 팔꿈치가 몸통에서 멀리 떨어져선 안 된다.", "ans": "몸통막기는 팔목이 몸의 중심선에 오도록 정확하게 위치시키는 것이 가장 중요합니다. 팔의 내각은 90도에서 120도 사이를 유지해야 하며 막는 주먹의 높이는 어깨 높이 정도로 맞추어야 합니다. 반대쪽 팔목은 젖힌 주먹 상태로 장골능에 위치시켜야 합니다. 몸통과 함께 팔꿈치가 자연스럽게 진행해야 하며 팔꿈치가 몸통에서 너무 멀리 떨어지지 않도록 주의해야 합니다. 팔꿈치가 들리거나 주먹이 중심선까지 들어오지 않으면 감점될 수 있습니다.", "pre": [null, null, null], "memo": "확인 질문 5 참고", "en": {"q": "몸통막기 기준점 알려줘", "src": "Rules p.42", "exp": "Rules p.42: In every 몸통 안막기 the wrist comes to the body's centre line. Inner angle of the arm 90~120°. Blocking fist at about shoulder height. The other wrist at the iliac crest (장골능), with the fist turned up. The elbow moves with the trunk and stays close to it.", "memo": "See question 5 on the Questions for you tab."}}, {"id": 86, "sec": "기본동작", "q": "얼굴막기 감점 사항은?", "src": "경기규칙 p.42", "exp": "규칙 42쪽 주요 감점사항: 막는 팔목의 중심선이 얼굴의 중심선을 바깥으로 벗어나거나 이마 뒤로 넘어갈 경우. 팔꿈치가 먼저 올라가거나 막는 손이 얼굴이나 몸통에서 주먹 하나 간격보다 멀어지는 경우. 막는 팔이 반대편 장골능까지 들어가는 경우. 얼굴막기한 밑팔목이 위를 향한 경우.", "ans": "얼굴막기 동작에서 막는 팔목의 중심선이 얼굴의 중앙선을 벗어나 바깥으로 나가거나 이마 뒤로 넘어가는 경우 감점됩니다. 막는 손이 얼굴이나 몸통에서 주먹 하나 간격보다 멀어지거나 팔꿈치가 먼저 올라가는 경우에도 감점 사항에 해당합니다. 또한 막는 팔이 반대편 장골능까지 깊숙이 들어가는 경우와 얼굴막기한 밑팔목이 위를 향하는 경우에도 감점이 발생합니다. 이러한 기준은 정확한 방어 위치를 유지하고 동작의 효율성을 높이기 위해 정해진 것입니다.", "pre": [null, null, null], "memo": "", "en": {"q": "얼굴막기 감점 사항은?", "src": "Rules p.42", "exp": "Rules p.42, deductions: the blocking wrist off the face's centre line, or past the forehead; the elbow rising first, or the blocking hand further than one fist from the face or trunk; the blocking arm reaching the opposite iliac crest; the underside of the blocking wrist facing up.", "memo": ""}}, {"id": 87, "sec": "기본동작", "q": "손날 거들어 바깥막기 어떻게 해?", "src": "경기규칙 p.42", "exp": "막는 손 끝의 높이는 어깨 정도로 한다. 손목이 구부러지지 말아야 한다. 거드는 손은 팔목이 명치 앞에 오게 하며, 손날과 몸통 사이는 약간(손바닥 하나 사이) 띄워 준다. (요령) 막는 손의 손바닥을 위로 향하게 하고, 반대 손은 손바닥 부분이 뒤로 향한 상태에서 시작한다. 모든 손동작의 회전은 손동작의 목표점에 다다르며 이루어져야 한다.", "ans": "손날 거들어 바깥막기는 막는 손 끝의 높이를 어깨 정도로 유지하며 손목이 꺾이지 않게 하는 것이 중요합니다. 거드는 손은 팔목이 명치 앞에 오도록 하고 손날과 몸통 사이는 손바닥 하나 정도의 간격을 띄워야 합니다. 시작할 때 막는 손의 손바닥은 위를 향하게 하고 반대 손은 손바닥 부분이 뒤를 향한 상태에서 동작을 시작합니다. 모든 손동작의 회전은 목표점에 다다를 때 이루어져야 하며 회전이 너무 빠르거나 마지막에 몰리지 않도록 주의해야 합니다. 거드는 손의 위치가 명치 앞이 아니거나 막는 손날의 손바닥이 측면을 향하면 감점될 수 있습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "손날 거들어 바깥막기 어떻게 해?", "src": "Rules p.42", "exp": "Rules p.42: Blocking fingertips at about shoulder height, with the wrist straight. The supporting hand's wrist is in front of the solar plexus (명치), one palm's width from the trunk. To start: the blocking palm faces up, and the other palm faces back. Every hand turn happens as the hand reaches its target.", "memo": ""}}, {"id": 88, "sec": "기본동작", "q": "바깥팔목 헤쳐막기 기준점 알려줘", "src": "경기규칙 p.43", "exp": "두 팔을 가슴 앞에서 엇걸어 교차한다. 두 바깥팔목이 몸 바깥선을 벗어나지 않도록 하고 두 팔꿈치는 아래로 향한다.", "ans": "바깥팔목 헤쳐막기는 두 팔을 가슴 앞에서 엇걸어 교차하며 수행하는 동작입니다. 이때 두 바깥팔목이 몸 바깥선을 벗어나지 않도록 주의해야 하며 두 팔꿈치는 아래를 향하게 합니다. 만약 두 주먹이 어깨선 위로 올라가거나 바깥팔목이 몸통 바깥선을 벗어나면 감점될 수 있습니다. 정확한 자세를 유지하여 동작의 완성도를 높여보시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "바깥팔목 헤쳐막기 기준점 알려줘", "src": "Rules p.43", "exp": "Rules p.43: cross the arms in front of the chest. The outer wrists stay inside the body's outer line, with both elbows pointing down.", "memo": ""}}, {"id": 89, "sec": "기본동작", "q": "아래 헤쳐막기 감점 사항은?", "src": "경기규칙 p.43", "exp": "규칙 43쪽 주요 감점사항: 주먹이 허벅지 옆에 위치하는 경우. 주먹과 허벅지 간격이 한 뼘 정도를 벗어나는 경우. 막는 팔이 반대편 장골능까지 들어가는 경우. 주먹등이 대각선 형태를 벗어나는 경우.", "ans": "아래 헤쳐막기에서 주먹이 허벅지 옆에 위치하거나 주먹과 허벅지 간격이 한 뼘 정도를 벗어나면 감점됩니다. 또한 막는 팔이 반대편 장골능까지 들어가거나 주먹등이 대각선 형태를 벗어나는 경우에도 감점 사항에 해당합니다. 동작을 지나치게 늦게 하거나 빠르게 수행하는 경우와 헤쳐 막는 손이 단전에서 한 주먹 이상 벗어나는 경우도 주의해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래 헤쳐막기 감점 사항은?", "src": "Rules p.43", "exp": "Rules p.43, deductions: fists beside the thighs; the fist more or less than one hand-span from the thigh; the blocking arm reaching the opposite iliac crest; the back of the fist off the diagonal.", "memo": ""}}, {"id": 90, "sec": "기본동작", "q": "안팔목 헤쳐막기 할 때 자주 틀리는 점", "src": "경기규칙 p.43", "exp": "규칙 43쪽 주요 감점사항: 두 주먹을 앞으로 하여 등주먹으로 치는 경우. 두 안팔목이 몸통 바깥선을 벗어나는 경우.", "ans": "안팔목 헤쳐막기를 할 때 두 주먹을 앞으로 하여 등주먹으로 치거나 두 안팔목이 몸통 바깥선을 벗어나는 경우가 주요 감점 사항입니다. 동작을 수행할 때 이 점들을 유의하여 연습하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "안팔목 헤쳐막기 할 때 자주 틀리는 점", "src": "Rules p.43", "exp": "Rules p.43, deductions: both fists forward, striking with the back of the fist; the inner wrists past the trunk's outer line.", "memo": ""}}, {"id": 91, "sec": "유사 용어 구분", "q": "앞서기랑 앞굽이 차이가 뭐야?", "src": "경기규칙 p.38–39", "exp": "앞서기: 걸어가다 멈췄을 때의 한걸음 길이로 선다. 두 무릎은 펴며 체중을 두 다리에 균일하게 싣는다. 몸을 반듯하게 세우고 정면을 향한 몸통은 30° 정도 자연스럽게 틀어준다. 뒷발의 내각은 30° 정도.\n앞굽이: 두 발의 길이는 한걸음 반 정도로 한다. 몸을 반듯하게 서서 땅을 내려다봤을 때 앞에 있는 무릎과 발끝이 일치되도록 무릎과 몸을 낮춘다. 뒷발의 내각은 30° 정도, 뒷다리의 무릎을 펴고 체중의 2/3를 앞에 둔다. 몸을 반듯하게 세우고 몸통은 30° 정도로 틀어준다.", "ans": "앞서기와 앞굽이는 보폭과 체중 배분에서 큰 차이가 있습니다. 앞서기는 걸어가다 멈췄을 때의 한 걸음 길이로 서며 두 다리에 체중을 균일하게 싣는 것이 기준입니다. 반면 앞굽이는 두 발의 길이를 한 걸음 반 정도로 넓게 벌리고 체중의 3분의 2를 앞에 두어야 합니다. 앞서기는 두 무릎을 모두 펴고 서지만 앞굽이는 앞에 있는 무릎을 굽혀 발끝과 일치시키고 뒷다리의 무릎은 펴는 것이 핵심입니다. 두 서기 모두 몸통을 정면에서 30도 정도 자연스럽게 틀어주고 뒷발의 내각을 30도 정도로 유지해야 한다는 공통점이 있습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞서기랑 앞굽이 차이가 뭐야?", "src": "Rules p.38–39", "exp": "앞서기: One step's length, the step you stop on when walking. Both knees straight, with the weight even on both legs. Body upright, trunk turned naturally about 30°. Inner angle of the back foot about 30°.\n앞굽이: About one and a half steps between the feet. Body upright and lowered until, looking down, the front knee lines up with the toes. Inner angle of the back foot about 30°, back knee straight, two thirds (2/3) of the weight forward. Trunk turned about 30°.", "memo": ""}}, {"id": 92, "sec": "유사 용어 구분", "q": "앞굽이와 뒷굽이 뭐가 달라?", "src": "경기규칙 p.39", "exp": "앞굽이: 두 발의 길이는 한걸음 반 정도로 한다. 몸을 반듯하게 서서 땅을 내려다봤을 때 앞에 있는 무릎과 발끝이 일치되도록 무릎과 몸을 낮춘다. 뒷발의 내각은 30° 정도, 뒷다리의 무릎을 펴고 체중의 2/3를 앞에 둔다. 몸을 반듯하게 세우고 몸통은 30° 정도로 틀어준다.\n뒷굽이: (오른 뒷굽이) 오른발을 90° 벌려 선 상태에서 왼발 한걸음 길이로 내디디며 몸을 반듯하게 세우고 두 무릎을 굽혀 몸을 낮춘다. 몸을 낮출 때 무릎은 오른발 끝 지면과 60~70°되게 굽히고 왼발 무릎은 정면(왼발 끝 방향)으로 지면에서 100~110°가량 약간 구부린다. 두 무릎은 90°가 되게 한다. 주춤서기 때와 같이 무릎을 안으로 조이면 안 된다.", "ans": "앞굽이는 두 발의 길이를 한 걸음 반 정도로 하고 앞 무릎과 발끝이 일치하도록 무릎을 굽히며 체중의 3분의 2를 앞에 둡니다. 뒷굽이는 두 무릎을 굽혀 몸을 낮추고 앞발 뒤꿈치가 들리지 않게 하며 몸의 중심축을 유지하는 것이 다릅니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞굽이와 뒷굽이 뭐가 달라?", "src": "Rules p.39", "exp": "앞굽이: About one and a half steps between the feet. Body upright and lowered until, looking down, the front knee lines up with the toes. Inner angle of the back foot about 30°, back knee straight, two thirds (2/3) of the weight forward. Trunk turned about 30°.\n뒷굽이: (오른 뒷굽이) With the right foot opened 90°, the left foot steps out one step's length; body upright, both knees bent to lower the body. The right knee bends to 60~70° with the ground at the toes; the left knee bends slightly, about 100~110° from the ground, facing forward. 90° between the knees. The knees must not squeeze inward as in 주춤서기.", "memo": ""}}, {"id": 93, "sec": "유사 용어 구분", "q": "뒷굽이 범서기 구분해줘", "src": "경기규칙 p.39", "exp": "뒷굽이: (오른 뒷굽이) 오른발을 90° 벌려 선 상태에서 왼발 한걸음 길이로 내디디며 몸을 반듯하게 세우고 두 무릎을 굽혀 몸을 낮춘다. 몸을 낮출 때 무릎은 오른발 끝 지면과 60~70°되게 굽히고 왼발 무릎은 정면(왼발 끝 방향)으로 지면에서 100~110°가량 약간 구부린다. 두 무릎은 90°가 되게 한다. 주춤서기 때와 같이 무릎을 안으로 조이면 안 된다.\n범서기: (왼 범서기) 모아서기에서 오른발을 30° 정도의 각으로 넓혀 서며 왼발을 오른발 끝에서 한발 길이로 내딛는다. 체중을 뒷발에 싣고 뒷발을 내려다봤을 때 무릎과 발끝이 일직선이 되게 한다. 앞에 있는 왼발의 발목을 펴고 앞축만 가볍게 딛고 무릎을 약간 안으로 튼다. 아랫배에 힘을 주며 체중을 뒷발에 90~100% 싣는다.", "ans": "뒷굽이는 오른발을 90도 벌려 내디디며 두 무릎을 굽혀 몸을 낮추고 체중을 양발에 분산하는 서기입니다. 반면 범서기는 뒷발에 체중을 90에서 100퍼센트 싣고 앞발의 앞축만 가볍게 딛는 자세로 뒷발의 무릎과 발끝이 일직선이 되게 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "뒷굽이 범서기 구분해줘", "src": "Rules p.39", "exp": "뒷굽이: (오른 뒷굽이) With the right foot opened 90°, the left foot steps out one step's length; body upright, both knees bent to lower the body. The right knee bends to 60~70° with the ground at the toes; the left knee bends slightly, about 100~110° from the ground, facing forward. 90° between the knees. The knees must not squeeze inward as in 주춤서기.\n범서기: (왼 범서기) From 모아서기, the right foot opens about 30° and the left foot steps out one foot's length from the right toes. Weight on the back foot, with the back knee and toes in one line when looking down. Left ankle extended, only the ball of the foot lightly down, knee turned slightly inward. Tighten the lower abdomen, with 90~100% of the weight on the back foot.", "memo": ""}}, {"id": 94, "sec": "유사 용어 구분", "q": "앞꼬아서기랑 뒤꼬아서기 차이가 뭐야?", "src": "경기규칙 p.40", "exp": "앞꼬아서기: 좌우로 이동 시 사용되는 서기 동작. 지지되는 발의 발등을 넘어 새끼발가락 옆에(세운주먹 하나 정도) 앞축을 딛는다. 앞발은 정면에서 45° 각을 이루며, 뒷발의 정강이가 앞발의 장딴지에 붙인다.\n뒤꼬아서기: 앞뒤로 이동 시 사용되는 서기 동작. 지지가 되는 발의 뒤꿈치의 대각선상에 앞축을 딛는다. 앞발은 정면에서 45° 각을 이루며, 뒷발의 정강이가 앞발의 장딴지에 붙인다.", "ans": "앞꼬아서기와 뒤꼬아서기는 이동 방향과 발을 딛는 위치에서 차이가 있습니다. 앞꼬아서기는 좌우로 이동할 때 사용하며 지지하는 발의 발등을 넘어 새끼발가락 옆에 앞축을 딛고 앞발은 정면에서 45도 각도를 이룹니다. 반면 뒤꼬아서기는 앞뒤로 이동할 때 사용하며 지지하는 발 뒤꿈치의 대각선상에 앞축을 딛고 마찬가지로 앞발은 정면에서 45도 각도를 유지합니다. 두 동작 모두 뒷발의 정강이가 앞발의 장딴지에 붙어야 하며 발이 교차하지 않거나 간격이 주먹 하나보다 넓으면 감점될 수 있습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞꼬아서기랑 뒤꼬아서기 차이가 뭐야?", "src": "Rules p.40", "exp": "앞꼬아서기: A stance for moving sideways. Over the supporting foot's instep, the ball of the foot lands about one upright fist beside the little toe. The front foot is 45° from straight ahead, with the back shin against the front calf.\n뒤꼬아서기: A stance for moving forward and back. The ball of the foot lands on the diagonal from the supporting heel. The front foot is 45° from straight ahead, with the back shin against the front calf.", "memo": ""}}, {"id": 95, "sec": "유사 용어 구분", "q": "아래막기 얼굴막기 구분해줘", "src": "경기규칙 p.41–42", "exp": "아래막기: 막는 주먹은 앞발의 대퇴부에서 세운 주먹 두 개 정도 또는 한 뼘 정도 간격이다. 반대 팔목은 젖힌 주먹으로 장골능에 위치시킨다. (요령) 막는 주먹은 어깨높이 정도 올리고 막는 주먹 바닥 부분이 반대편 얼굴을 향하게 한다. 반대 손은 엎은 주먹 상태로 자연스럽게 명치선에 오게 한다. 막는 팔의 팔꿈치가 들리지 않아야 하며 몸에 붙이지 않는 선에서 행한다. 몸통을 사용하지 않고 팔만 이용해서 막으면 안 된다.\n얼굴막기: 막는 팔의 팔목이 얼굴 중앙선에 위치하며, 주먹 하나 정도가 이마에서 떨어지게 한다. 반대 팔목은 옆구리(장골능)에 위치한다. (요령) 막는 팔은 젖힌 주먹으로 반대 팔 팔꿈치보다 약간 바깥쪽에서 아래로 하고, 반대 팔은 주먹등이 위를 향하게 하여 반대편 어깨 높이에서 시작한다. 주먹이 팔목을 틀며 팔꿈치보다 먼저 올라가야 하며 바깥팔목으로 인중 앞을 올려 막는다.", "ans": "아래막기는 막는 주먹이 앞발 대퇴부에서 주먹 두 개 정도 간격에 위치하며, 얼굴막기는 막는 팔목이 얼굴 중앙선에 위치하고 이마에서 주먹 하나 정도 떨어지게 합니다. 아래막기는 내려막기로 부르지 않으며, 얼굴막기는 올려막기로 지칭하지 않고 각각의 명칭을 사용합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래막기 얼굴막기 구분해줘", "src": "Rules p.41–42", "exp": "아래막기: The blocking fist is about two upright fists, or one hand-span, from the front thigh. The other wrist is at the iliac crest (장골능), with the fist turned up. To start: the blocking fist rises to about shoulder height with its base toward the opposite side of the face, and the other hand, fist turned down, comes to the solar plexus (명치) line. The elbow stays down, without touching the body. Use the trunk, not only the arm.\n얼굴막기: The blocking wrist is on the centre line of the face, about one fist from the forehead. The other wrist is at the side (장골능). To start: the blocking fist, turned up, is low and a little outside the other elbow, and the other arm starts at the opposite shoulder's height. The fist rises before the elbow while the wrist turns, and the outer wrist blocks upward past the philtrum (인중).", "memo": ""}}, {"id": 96, "sec": "유사 용어 구분", "q": "몸통 바깥막기랑 몸통막기 차이가 뭐야?", "src": "경기규칙 p.41–42", "exp": "몸통 바깥막기: 막는 팔의 주먹등이 몸으로 향하게 하고 주먹 끝이 어깨선과 일치하게 한다. 반대 팔목은 젖힌 주먹으로 장골능에 위치시킨다. (요령) 막는 팔의 주먹은 젖힌 주먹으로 반대 팔의 팔꿈치보다 약간 아래(주먹 하나 정도)에 두고, 반대 팔은 막는 팔 안쪽에서 주먹등 부분이 위쪽을 향하게 하여 막는 팔의 어깨에서 약간 떨어진 상태로 시작한다. 시작점 높이는 몸통 부위 안에서 이루어져야 한다. 중간 과정은 주먹이나 손끝이 위를 향해 인중선 높이 정도로 약간의 곡선을 이루듯 지나간다.\n몸통막기: 모든 몸통 안막기는 팔목이 몸의 중심선에 와야 한다. 팔의 내각은 90~120°로 한다. 막는 주먹의 높이는 어깨높이 정도로 한다. 반대 팔목은 젖힌 주먹으로 장골능에 위치한다. 몸통과 함께 팔꿈치가 진행해야 하며 팔꿈치가 몸통에서 멀리 떨어져선 안 된다.", "ans": "몸통 바깥막기는 막는 팔의 주먹등이 몸 바깥쪽을 향하며 팔꿈치가 대퇴선상에 위치하도록 하는 기술입니다. 반면 몸통막기는 일반적으로 안막기를 의미하며 막는 팔의 주먹등이 몸 안쪽을 향하게 하여 몸의 중심을 방어하는 차이가 있습니다. 몸통 바깥막기는 막는 팔의 주먹 끝이 어깨선과 일치해야 하며 중간 과정에서 주먹이나 손끝이 인중선 높이 정도로 약간의 곡선을 그리며 나가야 합니다. 이때 막는 팔의 팔꿈치가 들리거나 시작점이 장골능에서 시작되면 감점 요인이 될 수 있습니다. 두 기술은 막는 팔의 방향과 궤적이 다르므로 정확한 위치와 각도를 유지하는 것이 중요합니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 주먹등 방향이 기대 답변과 반대임. 기대 답변만 확인해 주세요.\n확인 질문 5 참고", "en": {"q": "몸통 바깥막기랑 몸통막기 차이가 뭐야?", "src": "Rules p.41–42", "exp": "몸통 바깥막기: The back of the blocking fist faces the body, with the tip of the fist on the shoulder line. The other wrist is at the iliac crest (장골능), with the fist turned up. To start: the blocking fist, turned up, is a little below the other elbow (about one fist), and the other arm is inside it, slightly away from the shoulder. The start stays within the trunk. Midway, the fist or fingertips pass upward at about philtrum (인중) height in a slight curve.\n몸통막기: In every 몸통 안막기 the wrist comes to the body's centre line. Inner angle of the arm 90~120°. Blocking fist at about shoulder height. The other wrist at the iliac crest (장골능), with the fist turned up. The elbow moves with the trunk and stays close to it.", "memo": "Known error: the direction of the back of the fist is opposite to the expected answer. Please check the expected answer only.\nSee question 5 on the Questions for you tab."}}, {"id": 97, "sec": "유사 용어 구분", "q": "지르기랑 편손끝 찌르기 차이가 뭐야?", "src": "경기규칙 p.44", "exp": "지르기: 서기의 다리를 앞, 뒤로 넓혀 딛고서(앞굽이, 뒷굽이 관계없이) 주먹으로 지르기를 하였을 때를 말한다. 주먹은 장골능에서 시작하여 목표점에 도달할 때 회전 동작이 완성되어야 한다. (요령) 당기는 주먹은 지르는 주먹의 목표와 같은 선상에서 당긴다. 팔꿈치가 몸의 바깥 부분을 스치며 나가고 들어와야 한다.\n편손끝 찌르기: 반대 손의 손등 위로 편손끝 찌르는 팔꿈치가 위치한다. 편손끝은 명치 높이로 곧게 찌른다. (요령) 손바닥으로 눌러 막는 동시에 허리에 있던 편손끝으로 찌른다.", "ans": "지르기는 주먹을 사용하여 목표점을 타격하는 동작이며 편손끝 찌르기는 손끝을 곧게 펴서 명치 높이를 찌르는 동작입니다. 지르기는 장골능에서 시작하여 주먹을 회전시키며 목표점에 도달해야 하며 팔꿈치가 몸의 바깥 부분을 스치듯 나가고 들어와야 합니다. 반면 편손끝 찌르기는 반대 손의 손등 위로 찌르는 팔의 팔꿈치가 위치해야 하며 손바닥으로 눌러 막는 동작과 동시에 찌르기를 수행해야 합니다. 지르기 시 주먹을 미리 틀거나 어깨를 과도하게 내밀면 감점되며 편손끝 찌르기는 팔꿈치가 손등이 아닌 손가락 위에 위치할 경우 감점 대상이 됩니다.", "pre": [null, null, null], "memo": "", "en": {"q": "지르기랑 편손끝 찌르기 차이가 뭐야?", "src": "Rules p.44", "exp": "지르기: A punch with the legs spread front and back (앞굽이 or 뒷굽이). The fist starts at the iliac crest (장골능), and its turn is complete on reaching the target. The pulling fist pulls back on the same line as the punching fist's target. The elbow brushes past the outer side of the body going out and coming back.\n편손끝 찌르기: The thrusting elbow is above the back of the other hand. The spear hand thrusts straight at solar plexus (명치) height. The palm presses down as the spear hand thrusts from the waist.", "memo": ""}}, {"id": 98, "sec": "유사 용어 구분", "q": "앞차기 옆차기 구분해줘", "src": "경기규칙 p.45", "exp": "앞차기: 각 품새에서 특별한 규정이 없을 때에 모든 차기 기술의 목표는 얼굴 높이 이상으로 한다. 차는 발의 무릎을 앞으로 접어 올려 찬다. 사용 부위가 목표를 향해 차야 한다. 차기 시 양손은 가슴에 붙이지 않고 자연스럽게 모은다. 앞차기는 앞축으로 찬다.\n옆차기: 각 품새에서 특별한 규정이 없을 때에 모든 차기 기술의 목표는 얼굴 높이 이상으로 한다. 차는 발의 무릎을 앞으로 접어 올려 찬다. 사용 부위가 목표를 향해 차야 한다. 차기 시 양손은 가슴에 붙이지 않고 자연스럽게 모은다. 옆차기는 발날의 뒤축 부분이 발 앞부분보다 올라가야 하고, 앞축을 축으로 발바닥이 회전하며, 머리와 상체는 허리선 이상에 위치한다.", "ans": "앞차기는 앞축을 사용하며 무릎을 앞으로 접어 올려 목표를 향해 차는 기술입니다. 옆차기는 발날의 뒤축 부분을 사용하며 지지발의 앞축을 축으로 발바닥이 회전하도록 차야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞차기 옆차기 구분해줘", "src": "Rules p.45", "exp": "앞차기: Unless a form says otherwise, the target of every kick is face height or higher. The kicking knee folds up forward. The striking part goes toward the target. The hands are gathered naturally, not against the chest. 앞차기 uses the ball of the foot.\n옆차기: Unless a form says otherwise, the target of every kick is face height or higher. The kicking knee folds up forward. The striking part goes toward the target. The hands are gathered naturally, not against the chest. In 옆차기 the heel side of the foot edge goes higher than the front of the foot, the sole pivots on the ball of the foot, and the head and upper body stay above the waist line.", "memo": ""}}, {"id": 99, "sec": "유사 용어 구분", "q": "앞차기랑 돌려차기 차이가 뭐야?", "src": "경기규칙 p.45", "exp": "앞차기: 각 품새에서 특별한 규정이 없을 때에 모든 차기 기술의 목표는 얼굴 높이 이상으로 한다. 차는 발의 무릎을 앞으로 접어 올려 찬다. 사용 부위가 목표를 향해 차야 한다. 차기 시 양손은 가슴에 붙이지 않고 자연스럽게 모은다. 앞차기는 앞축으로 찬다.\n돌려차기: 각 품새에서 특별한 규정이 없을 때에 모든 차기 기술의 목표는 얼굴 높이 이상으로 한다. 차는 발의 무릎을 앞으로 접어 올려 찬다. 사용 부위가 목표를 향해 차야 한다. 차기 시 양손은 가슴에 붙이지 않고 자연스럽게 모은다. 돌려차기는 앞축 또는 발등으로 하고, 목표를 수평 형태로 찬다.", "ans": "앞차기와 돌려차기는 차는 방향과 발의 사용 부위에서 차이가 있습니다. 앞차기는 앞축을 사용하여 정면을 향해 차는 기술이며, 돌려차기는 앞축이나 발등을 사용하여 목표를 수평 형태로 차는 기술입니다. 두 기술 모두 목표는 얼굴 높이 이상으로 해야 하며, 차는 발의 무릎을 앞으로 접어 올리는 과정은 동일합니다. 또한 차기 시 양손은 가슴에 붙이지 않고 자연스럽게 겨룸새 형태를 유지해야 합니다. 돌려차기를 할 때 직선으로 찔러 차거나 앞차기 시 목표가 전면이 아닌 위로 뻗어 올리는 경우 감점될 수 있습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "앞차기랑 돌려차기 차이가 뭐야?", "src": "Rules p.45", "exp": "앞차기: Unless a form says otherwise, the target of every kick is face height or higher. The kicking knee folds up forward. The striking part goes toward the target. The hands are gathered naturally, not against the chest. 앞차기 uses the ball of the foot.\n돌려차기: Unless a form says otherwise, the target of every kick is face height or higher. The kicking knee folds up forward. The striking part goes toward the target. The hands are gathered naturally, not against the chest. 돌려차기 uses the ball of the foot or the instep, and kicks the target on a level line.", "memo": ""}}, {"id": 100, "sec": "유사 용어 구분", "q": "바로지르기랑 반대지르기 차이", "src": "미기재", "exp": "바로지르기: 뒷발 쪽 주먹. 반대지르기: 앞발 쪽 주먹. 그냥 지르기로 답하지 않음.", "ans": "바로지르기는 앞서기한 다리와 같은 쪽 주먹으로 지르는 기술이며, 반대지르기는 앞서기한 다리와 반대쪽 주먹으로 지르는 기술입니다. 지르기를 할 때는 주먹이 장골능에서 시작하여 목표점에 도달할 때 회전 동작이 완성되어야 합니다. 당기는 주먹은 지르는 주먹의 목표와 같은 선상에서 당겨야 하며, 팔꿈치가 몸의 바깥 부분을 스치며 나가고 들어와야 합니다. 주먹을 미리 허리에서 틀어서 나가거나 미는 경우, 혹은 팔꿈치가 벌어져 나가는 경우 감점될 수 있으니 주의해야 합니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 바로지르기와 반대지르기가 반대로 설명됨. 기대 답변만 확인해 주세요.", "en": {"q": "바로지르기랑 반대지르기 차이", "src": "Not given", "exp": "바로지르기: 뒷발 쪽 주먹. 반대지르기: 앞발 쪽 주먹. Not plain 지르기.", "memo": "Known error: 바로지르기 and 반대지르기 are reversed. Please check the expected answer only."}}, {"id": 101, "sec": "유사 용어 구분", "q": "반대지르기가 뭐야?", "src": "미기재", "exp": "앞발과 같은 쪽 주먹으로 지르기. 바로지르기가 아님.", "ans": "반대지르기는 앞서기나 앞굽이 등 서기 동작에서 앞에 있는 다리와 반대쪽 손으로 지르는 기술을 말합니다. 예를 들어 오른 앞서기를 한 상태에서 왼 주먹으로 지르는 것이 반대지르기입니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 바로지르기와 반대지르기가 반대로 설명됨. 기대 답변만 확인해 주세요.", "en": {"q": "반대지르기가 뭐야?", "src": "Not given", "exp": "앞발과 같은 쪽 주먹으로 지르기, not 바로지르기.", "memo": "Known error: 바로지르기 and 반대지르기 are reversed. Please check the expected answer only."}}, {"id": 102, "sec": "유사 용어 구분", "q": "바로지르기 설명해줘", "src": "미기재", "exp": "뒷발 쪽 주먹으로 지르기. 반대지르기가 아님.", "ans": "바로지르기는 서기의 다리를 앞뒤로 넓혀 딛고 주먹으로 목표를 타격하는 동작입니다. 주먹은 장골능에서 시작하여 목표점에 도달할 때 회전 동작이 완전히 이루어져야 합니다. 당기는 주먹은 지르는 주먹의 목표와 같은 선상에서 당겨야 하며 팔꿈치는 몸의 바깥 부분을 스치며 나가고 들어와야 합니다. 모든 공격은 각 품새에서 요구하는 공격의 특성을 살려 수행해야 합니다. 회전이 먼저 이루어지거나 팔꿈치가 벌어지는 경우, 주먹을 미리 틀어서 나가는 경우 등은 감점 사항이 될 수 있습니다.", "pre": [null, "평가 생략", "평가 생략"], "memo": "개발팀 확인 오류: 어느 쪽 주먹인지 답하지 않음. 기대 답변만 확인해 주세요.", "en": {"q": "바로지르기 설명해줘", "src": "Not given", "exp": "뒷발 쪽 주먹으로 지르기, not 반대지르기.", "memo": "Known error: does not say which fist. Please check the expected answer only."}}, {"id": 103, "sec": "유사 용어 구분", "q": "안막기랑 바깥막기 차이", "src": "KTA 9급", "exp": "안막기는 밖에서 안으로, 바깥막기는 안에서 밖으로의 움직임.", "ans": "안막기는 밖에서 안으로 움직이는 기술이며 바깥막기는 안에서 밖으로 움직이는 기술입니다. 안막기는 팔목이 몸의 중심선에 와야 하며 팔의 내각은 90도에서 120도 사이를 유지해야 합니다. 바깥막기는 막는 팔의 주먹등이 몸으로 향하게 하고 주먹 끝이 어깨선과 일치하도록 해야 합니다. 안막기 시 막는 주먹의 높이는 어깨높이 정도로 하며 반대 팔목은 젖힌 주먹으로 장골능에 위치시킵니다. 바깥막기는 중간 과정에서 주먹이나 손끝이 인중선 높이 정도로 약간의 곡선을 그리며 나가야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "안막기랑 바깥막기 차이", "src": "KTA grade 9", "exp": "KTA grade 9: 안막기 moves from outside in; 바깥막기 moves from inside out.", "memo": ""}}, {"id": 104, "sec": "유사 용어 구분", "q": "몸통지르기랑 얼굴지르기 높이 차이", "src": "KTA 9급 신체 용어", "exp": "몸통은 명치, 얼굴은 인중.", "ans": "몸통지르기는 주먹이 명치 높이에서 멈추며 얼굴지르기는 주먹이 인중 높이에서 멈추는 것이 기준입니다. 지르기 동작은 장골능에서 시작하여 목표점에 도달할 때 회전 동작이 완성되어야 하며 당기는 주먹은 지르는 주먹의 목표와 같은 선상에 위치해야 합니다. 팔꿈치는 몸의 바깥 부분을 스치듯 나가고 들어와야 하며 주먹을 목표점에 멈출 때 손목이 구부러지지 않도록 주의해야 합니다. 목표점을 위로 밀어 올리거나 주먹을 미리 틀어서 나가는 것은 감점 사항이므로 정확한 높이와 궤적을 유지하며 수련하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "몸통지르기랑 얼굴지르기 높이 차이", "src": "KTA grade 9 body terms", "exp": "KTA grade 9 body terms: 몸통 is the solar plexus (명치), 얼굴 is the philtrum (인중).", "memo": ""}}, {"id": 105, "sec": "유사 용어 구분", "q": "얼굴막기랑 올려막기는 같은 거야?", "src": "KTA", "exp": "'올려막기'로 지칭하지 않고 '얼굴막기'로 사용한다.", "ans": "태권도 용어 정의에 따르면 얼굴막기는 올려막기라는 명칭을 사용하지 않고 얼굴막기로 지칭하여 사용합니다. 따라서 두 용어는 같은 동작을 의미합니다.", "pre": [null, null, null], "memo": "확인 질문 7 참고", "en": {"q": "얼굴막기랑 올려막기는 같은 거야?", "src": "KTA", "exp": "KTA: the term is 얼굴막기, not 올려막기.", "memo": "See question 7 on the Questions for you tab."}}, {"id": 106, "sec": "유사 용어 구분", "q": "아래막기를 내려막기라고 해도 돼?", "src": "KTA", "exp": "'내려막기'로 사용하지 않고 '아래막기'로 지칭한다.", "ans": "태권도에서 아래막기는 정식 명칭이며, 이를 내려막기라고 부르는 것은 올바른 용어가 아닙니다. 국기원 공인 품새에서는 아래막기라는 용어를 사용하니 이 점을 유의해 주시기 바랍니다.", "pre": [null, null, null], "memo": "확인 질문 7 참고", "en": {"q": "아래막기를 내려막기라고 해도 돼?", "src": "KTA", "exp": "KTA: the term is 아래막기, not 내려막기.", "memo": "See question 7 on the Questions for you tab."}}, {"id": 107, "sec": "유사 용어 구분", "q": "아래막기랑 아래 헤쳐막기 차이", "src": "경기규칙 (쪽수 미기재)", "exp": "아래막기: 막는 주먹이 앞발 대퇴부 앞, 반대 손은 장골능. 아래 헤쳐막기: 두 팔목을 가슴 앞에서 엇걸어 단전 앞에서 바깥으로 헤침.", "ans": "아래막기는 한 팔을 사용하여 앞발 대퇴부 앞쪽을 막는 기술이며, 아래 헤쳐막기는 두 팔목을 교차했다가 양옆으로 헤치며 막는 기술입니다. 아래막기는 막는 주먹이 앞발 대퇴부에서 주먹 두 개 정도 간격에 위치해야 하며, 반대 손은 장골능에 위치시켜야 합니다. 반면 아래 헤쳐막기는 두 손을 교차하여 단전을 지나치며 막아야 하며, 주먹의 높이가 어깨 높이 이상으로 올라가지 않도록 주의해야 합니다. 아래막기는 몸통을 함께 사용하여 방어의 특성을 살려야 하고, 아래 헤쳐 막기는 헤쳐 막는 손이 단전에서 한 주먹 이상 벗어나지 않아야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "아래막기랑 아래 헤쳐막기 차이", "src": "Rules (page not given)", "exp": "아래막기: the blocking fist ends in front of the front thigh, the other hand at the iliac crest (장골능). 아래 헤쳐막기: cross both wrists in front of the chest and part them outward in front of the lower abdomen (단전).", "memo": ""}}, {"id": 108, "sec": "유사 용어 구분", "q": "손날 안막기랑 안막기 차이는?", "src": "KTA 6급", "exp": "몸통 안막기와 같은 형태로 예비동작, 막는 손만 손날 사용.", "ans": "손날 안막기와 안막기는 사용하는 손의 부위와 그에 따른 기술적 특징에서 차이가 있습니다. 안막기는 주먹을 사용하여 밖에서 안으로 움직이며 몸통을 방어하는 직선적인 기술입니다. 반면 손날 안막기는 몸통 안막기와 동일한 예비 동작을 취하지만, 손날을 사용하여 막는다는 점이 가장 큰 차이점입니다. 손날 안막기는 손날을 세워 막기 때문에 손날의 날카로운 부분을 활용하여 상대의 공격을 방어하는 형태를 띱니다. 두 기술 모두 밖에서 안으로 움직이는 궤적을 가지지만, 손의 모양과 접촉 부위가 다르므로 이를 구분하여 연습해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "손날 안막기랑 안막기 차이는?", "src": "KTA grade 6", "exp": "KTA grade 6: the same preparation as 몸통 안막기; only the blocking hand uses the knife hand (손날).", "memo": ""}}, {"id": 109, "sec": "품새 동작 방법", "q": "태극 8장 두발당성 앞차기 어떻게 해?", "src": "경기규칙 p.53", "exp": "태극 8장: 첫 번째 발을 몸통 높이 이상 차고 이어서 다음 발은 얼굴 높이로 찬다. 두발당성차기를 하고 한걸음 정도 앞으로 내려딛는다.", "ans": "태극 8장의 두 발 당성차기는 왼 앞굽이 오른 지르기 자세에서 몸을 위로 뛰어올라 공중에서 오른발과 왼발을 순서대로 차는 동작입니다. 첫 번째 오른발은 몸통 높이 이상으로 차서 몸을 띄우는 역할을 하고, 이어서 왼발로 얼굴 높이까지 두 번째 앞차기를 수행합니다. 첫 번째 발이 지면에 닿기 전에 연속해서 차야 하며, 두 번째 앞차기를 할 때 기합을 넣습니다. 공중에서 상체가 뒤로 젖혀지지 않도록 복부에 힘을 주고 양손은 흔들리지 않게 유지해야 합니다. 동작을 마친 후에는 한 걸음 정도 앞으로 내려딛으며 왼 앞굽이 왼 안막기로 자연스럽게 연결합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 8장 두발당성 앞차기 어떻게 해?", "src": "Rules p.53", "exp": "Rules p.53, Taegeuk 8: the first foot kicks at trunk height or higher, the next foot at face height, then step down about one step forward.", "memo": ""}}, {"id": 110, "sec": "품새 동작 방법", "q": "태극 6장 손날 얼굴 비틀어 막기 어떻게 해?", "src": "경기규칙 p.50", "exp": "태극 6장: 앞굽이 비틀어 막기는 팔을 교차하여 손날이 얼굴 높이가 되어야 하며 어깨선이 45° 정도 되어야 한다.", "ans": "태극 6장의 손날 얼굴 비틀어 막기는 팔을 교차하여 손날이 얼굴 높이에 오도록 하고 어깨선은 45도 정도가 되게 해야 합니다. 이 동작은 상대의 공격을 얼굴 바깥쪽으로 받아내는 느낌으로 수행하며 손날의 방향과 손목 비틀림을 분명히 하는 것이 중요합니다. 몸통이 충분히 틀어지지 않고 한 손으로만 하거나 손날 막기가 몸통 바깥 선을 넘어가면 감점될 수 있습니다. 태극 6장 8번째 동작은 왼 앞굽이에서 오른 손날로, 19번째 동작은 오른 앞굽이에서 왼 손날로 각각 수행합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 6장 손날 얼굴 비틀어 막기 어떻게 해?", "src": "Rules p.50", "exp": "Rules p.50, Taegeuk 6: in 앞굽이, cross the arms; the knife hand is at face height and the shoulder line at about 45°.", "memo": ""}}, {"id": 111, "sec": "품새 동작 방법", "q": "태극 4장 몸통 막고 지르기 할 때 주의할 점", "src": "경기규칙 p.47", "exp": "태극 4장 주요 감점사항: 몸통막기 하고 지를 때 막았던 손의 힘을 빼지 않아 손목이 자연스러운 회전이 이루어지지 않거나 과도한 회전이 되는 경우.", "ans": "태극 4장의 몸통 막고 지르기 동작에서는 막았던 손의 힘을 빼고 자연스럽게 손목을 회전하여 장골능에 위치시키는 것이 중요합니다. 연결 동작에서 손목 회전이 자연스럽게 이루어지도록 표현해야 하며, 막았던 손의 힘을 빼지 않아 손목 회전이 부자연스럽거나 과도하게 회전되지 않도록 주의하세요.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 4장 몸통 막고 지르기 할 때 주의할 점", "src": "Rules p.47", "exp": "Rules p.47, Taegeuk 4, deductions: not relaxing the blocking hand when punching after the block, so the wrist does not turn naturally or turns too far.", "memo": ""}}, {"id": 112, "sec": "품새 동작 방법", "q": "태극 6장 앞차고 몸통 바깥 막기 어떻게 해?", "src": "경기규칙 p.50", "exp": "태극 6장: 앞차기 후 물러 디뎌 오른 뒷굽이 (몸통) 바깥막기를 연속으로 이어서 해야 한다. (바깥막기 손과 뒷굽이 딛는 발이 동시에 한다.)", "ans": "태극 6장의 7번째 동작은 왼발 앞차기 후 왼발을 뒤로 물러 디디며 왼 뒷굽이 자세에서 오른팔로 바깥막기를 수행하는 동작입니다. 바깥막기를 할 때는 막는 팔의 주먹등이 몸 쪽을 향하게 하고 주먹 끝이 어깨선과 일치하도록 위치시켜야 합니다. 반대쪽 팔목은 젖힌 주먹 상태로 장골능에 두며 막는 팔의 주먹은 반대 팔의 팔꿈치보다 주먹 하나 정도 아래에 두어야 합니다. 막는 팔의 시작점은 몸통 부위 안에서 이루어져야 하며 중간 과정에서 주먹이 인중선 높이 정도로 약간의 곡선을 그리며 지나가야 합니다. 팔꿈치가 대퇴선상에 있지 않거나 들리는 경우, 혹은 시작점이 장골능에서 시작되는 경우 감점될 수 있으니 주의해야 합니다.", "pre": [null, null, null], "memo": "확인 질문 4 참고", "en": {"q": "태극 6장 앞차고 몸통 바깥 막기 어떻게 해?", "src": "Rules p.50", "exp": "Rules p.50, Taegeuk 6: after 앞차기, step back and go straight into 오른 뒷굽이 (몸통) 바깥막기. The blocking hand and the foot stepping into 뒷굽이 move together.", "memo": "See question 4 on the Questions for you tab."}}, {"id": 113, "sec": "품새 동작 방법", "q": "태극 5장 손날바깥막고 팔굽돌려치기 감점 사항", "src": "경기규칙 p.48", "exp": "태극 5장 주요 감점사항: 팔굽돌려치기 시 팔꿈치를 아래서 위로 올려치거나 어깨가 올라가는 경우. 주먹을 먼저 올려 시작하는 경우.", "ans": "태극 5장의 손날바깥막고 팔굽돌려치기 동작에서 발생하는 주요 감점 사항은 팔꿈치를 아래에서 위로 올려치거나 어깨가 올라가는 경우입니다. 또한 주먹을 먼저 올려서 동작을 시작하는 경우에도 감점 요인이 됩니다. 팔굽돌려치기를 할 때는 주먹을 몸통에 가까이 붙여야 하며 몸통의 회전을 이용하여 팔꿈치로 턱을 칠 수 있어야 합니다. 이러한 기준을 지켜야 정확한 동작으로 인정받을 수 있습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 5장 손날바깥막고 팔굽돌려치기 감점 사항", "src": "Rules p.48", "exp": "Rules p.48, Taegeuk 5, deductions: in 팔굽돌려치기, striking the elbow upward from below or the shoulder rising; starting by raising the fist first.", "memo": ""}}, {"id": 114, "sec": "품새 동작 방법", "q": "태극 5장 등주먹앞치기 감점 사항", "src": "경기규칙 p.49", "exp": "태극 5장 주요 감점사항: 뒤꼬아선 앞발의 발끝이 직선상에 있거나 두 발의 뒤축이 들려 있는 경우. 짓찧는 소리가 나지 않거나 발날의 각도가 45°가 유지되지 않는 경우. 뒤꼬아서기 시 세운주먹 하나 간격이 유지되지 않거나 두 발이 동시에 착지하는 경우.", "ans": "태극 5장의 등주먹앞치기 동작에서 뒤꼬아설 때 앞발의 발끝이 직선상에 있거나 두 발의 뒤축이 들려 있으면 감점됩니다. 또한 짓찧는 소리가 나지 않거나 발날의 각도가 45도를 유지하지 못하는 경우에도 감점 대상이 됩니다. 뒤꼬아서기 시 세운주먹 하나 간격이 유지되지 않거나 두 발이 동시에 착지하는 경우도 주요 감점 사항에 해당합니다. 정확한 동작을 위해 발날의 각도를 45도로 유지하고 뒤꼬아서기 간격을 신경 써서 연습하시기 바랍니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 5장 등주먹앞치기 감점 사항", "src": "Rules p.49", "exp": "Rules p.49, Taegeuk 5, deductions: the front foot's toes in a straight line, or both heels lifted, in 뒤꼬아서기; no stamping sound, or the foot edge not kept at 45°; one upright fist's gap not kept in 뒤꼬아서기, or both feet landing together.", "memo": ""}}, {"id": 115, "sec": "품새 동작 방법", "q": "태극 5장 메주먹 내려치기 어떻게 해?", "src": "경기규칙 p.48", "exp": "태극 5장: 메주먹으로 내려치는 손은 주먹이 겨드랑이를 지나 당기는 손 안쪽에서 행한다. 내려치는 주먹등이 반대쪽 얼굴 바깥선을 지나 둥글게 머리 위에서 메주먹으로 내려친다. 팔과 어깨가 수평이 되어야 한다. 서기는 오른서기와 왼서기다.", "ans": "태극 5장의 메주먹 내려치기는 메주먹으로 내려치는 손이 당기는 손 안쪽을 지나도록 동작을 수행해야 합니다. 내려치는 주먹등이 반대쪽 얼굴 바깥 선을 지나 둥글게 머리 위로 올라간 뒤 메주먹으로 내려치며, 이때 팔과 어깨가 수평을 이루어야 합니다. 서기는 왼 서기와 오른 서기를 사용하며, 당기는 손 바깥에서 내려치거나 메주먹이 어깨선보다 높거나 낮으면 감점 대상이 됩니다. 또한 나란히서기나 모아서기로 동작을 수행하지 않도록 주의해야 하며, 반드시 머리 위에서 내려치는 궤적을 유지해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 5장 메주먹 내려치기 어떻게 해?", "src": "Rules p.48", "exp": "Rules p.48, Taegeuk 5: the striking fist passes the armpit and moves inside the pulling hand; the back of the fist passes the outside of the opposite side of the face and circles over the head, then strikes down with the hammer fist. Arm and shoulder end level. The stance is 오른서기 or 왼서기.", "memo": ""}}, {"id": 116, "sec": "품새 동작 방법", "q": "태극 7장 보주먹 어떻게 해?", "src": "경기규칙 p.51", "exp": "태극 7장: 왼발 끌어 모둠발로 서며 보주먹은 인중 높이이다.(5초 정도) 보주먹은 오른 주먹을 왼손으로 감싼다.", "ans": "태극 7장의 14번째 동작인 모아서기 보주먹은 중앙선에서 두 발을 모아 서서 오른 주먹을 왼손으로 감싸며 인중 높이까지 천천히 올리는 동작입니다. 이 동작은 급하게 올리지 않고 호흡을 조절하며 흐름을 정리하는 것이 중요하며, 초보자는 팔을 너무 높이 들지 않도록 인중 높이를 기준으로 삼아야 합니다. 모아서기가 먼저 이루어지지 않고 서기와 손동작이 동시에 진행되면 감점될 수 있으니 주의해야 합니다. 보주먹은 왼 얼굴 등주먹 거들어 앞치기 이후에 수행하며, 이후에는 왼 앞굽이 가위막기로 자연스럽게 연결됩니다.", "pre": [null, null, null], "memo": "확인 질문 8 참고", "en": {"q": "태극 7장 보주먹 어떻게 해?", "src": "Rules p.51", "exp": "Rules p.51, Taegeuk 7: draw the left foot in to stand with the feet together; the 보주먹 is at philtrum (인중) height, about 5 seconds. The left hand wraps the right fist.", "memo": "See question 8 on the Questions for you tab."}}, {"id": 117, "sec": "품새 동작 방법", "q": "태극 4장 이어옆차기 어떻게 해?", "src": "경기규칙 p.47", "exp": "태극 4장: 옆차기 하고 한걸음 내딛음과 동시에 옆차기 찬다. 차기 시 양손은 가슴에 붙이지 않고 자연스럽게 모은다.(겨룸새)", "ans": "태극 4장의 이어옆차기는 첫 번째 옆차기를 수행한 후 한 걸음 내딛음과 동시에 다시 옆차기를 차는 동작입니다. 차기 동작을 수행할 때는 양손을 가슴에 붙이지 않고 자연스럽게 겨룸새 형태로 모아야 합니다. 첫 번째 옆차기 후 한 걸음 내딛지 않거나 차기 시 양손을 가슴 아래에 붙이는 경우 감점 사항이 될 수 있습니다. 또한 옆차기 시에는 발날의 뒤축 부분이 발 앞부분보다 올라가야 하며 지지발의 뒤축이 차는 방향으로 정확히 돌아야 합니다. 차기 후에는 착지하면서 다음 막기 자세로 자연스럽게 전환해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 4장 이어옆차기 어떻게 해?", "src": "Rules p.47", "exp": "Rules p.47, Taegeuk 4: kick 옆차기, step forward one step and kick 옆차기 again at the same moment. The hands are gathered naturally, not against the chest (guard position).", "memo": ""}}, {"id": 118, "sec": "품새 동작 방법", "q": "태극 7장 엇걸어막기 할 때 주의할 점", "src": "경기규칙 p.52", "exp": "태극 7장 주요 감점사항: 엇걸어 막는 부위가 손목일 경우. 엇걸어 막는 부위가 떨어져 있을 경우. 엇건 손 위치가 바뀐 경우.", "ans": "태극 7장의 엇걸어막기는 엇걸어 막는 부위가 손목이거나 막는 부위가 서로 떨어져 있으면 감점될 수 있습니다. 또한 엇걸어 막을 때 손의 위치가 바뀌지 않도록 주의해야 합니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 엇걸어막기 할 때 주의할 점", "src": "Rules p.52", "exp": "Rules p.52, Taegeuk 7, deductions: crossing at the hand-wrist joint; the crossed parts apart; the crossed hands in the wrong positions.", "memo": ""}}, {"id": 119, "sec": "품새 동작 방법", "q": "태극 7장 엇걸어막기 어떻게 해?", "src": "경기규칙 p.52", "exp": "태극 7장: 앞에 있는 발이 왼발일 때 왼손이 아래 있어야 하며 팔목 부위를 엇걸어 막는다.", "ans": "태극 7장의 엇걸어 아래막기는 22번째 동작인 오른 앞굽이 엇걸어 아래막기와 26번째 동작인 왼 앞굽이 엇걸어 아래막기가 있습니다. 22번째 동작은 왼 뒤 꼬아서기에서 뒤쪽 발을 정리해 오른 앞굽이를 만들며 두 팔을 교차했다가 아래로 내려 막습니다. 26번째 동작은 오른 뒤 꼬아서기에서 뒤쪽 발을 정리해 왼 앞굽이를 만들며 두 팔을 교차한 뒤 아래쪽으로 막아 상대의 하단 공격을 방어합니다. 엇걸어 아래막기는 두 팔이 서로 교차되는 준비 형태가 중요하며 초보자는 교차를 크게 만들어야 동작이 약해지지 않습니다.", "pre": [null, null, null], "memo": "", "en": {"q": "태극 7장 엇걸어막기 어떻게 해
